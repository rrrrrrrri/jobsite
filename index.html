<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<link rel="apple-touch-icon" href="icon.png">
<title>就活</title>
<style>
/* 上に Aletheia の「直近N日」の時間割、右上にタスク、下に企業2列。押すと次の画面へ。色は宝石色を意味にだけ */
:root{
  --bg:#f2f2f7; --card:#ffffff; --label:#000; --sub:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3); --sep:rgba(60,60,67,.16);
  --ink:#1c1c1e; --fill:rgba(120,120,128,.12); --grid:rgba(60,60,67,.12);
  --lapis:#2159bd; --ruby:#cc1c42; --rubysoft:#c06a78; --topaz:#c79a45; --emerald:#3a9a7e; --now:#ff3b30;
  --bar:rgba(249,249,249,.92);
  --m-body:#1c1c1e; --m-card-bd:rgba(60,60,67,.14);
  --mk-key-bg:rgba(214,171,94,.26); --mk-key-fg:#5c3d00; --mk-key-line:rgba(181,132,32,.65);
  --mk-due-bg:rgba(204,28,66,.13); --mk-due-fg:#9e1030; --mk-due-line:rgba(204,28,66,.45);
  --hl-person:#1a52b3; --hl-num:#157056; --hl-spk:rgba(60,60,67,.55);
  --m-callout-bg:rgba(214,171,94,.14); --m-callout-due-bg:rgba(204,28,66,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:light;
}
@media all{:root{
  --bg:#000; --card:#1c1c1e; --label:#fff; --sub:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --ink:#f2f2f7; --fill:rgba(118,118,128,.24); --grid:rgba(235,235,245,.08);
  --lapis:#70a3fa; --ruby:#f25770; --rubysoft:#d08592; --topaz:#d6ab5e; --emerald:#4fb894; --bar:rgba(22,22,24,.92);
  --m-body:#ececf1; --m-card-bd:rgba(255,255,255,.08);
  --mk-key-bg:rgba(214,171,94,.22); --mk-key-fg:#ffebb8; --mk-key-line:rgba(214,171,94,.65);
  --mk-due-bg:rgba(242,87,112,.20); --mk-due-fg:#ffa3b1; --mk-due-line:rgba(242,87,112,.52);
  --hl-person:#9ac2ff; --hl-num:#7be0bc; --hl-spk:rgba(235,235,245,.46);
  --m-callout-bg:rgba(214,171,94,.13); --m-callout-due-bg:rgba(242,87,112,.14);
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin:-8px -12px 6px;padding:0 8px;border-bottom:.5px solid var(--sep)}
.nav > div{min-width:0}
.nav .back{color:var(--lapis);display:flex;align-items:center;gap:2px;padding:8px 6px;max-width:100%;white-space:nowrap}
.nav .back #backl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .mid{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw;text-align:center}
.large{font-size:30px;font-weight:700;margin:6px 4px 8px;line-height:1.2}
.meta{font-size:15px;color:var(--sub);margin:-2px 4px 10px}
.sec{font-size:13px;color:var(--sub);margin:20px 16px 7px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 16px;position:relative;color:inherit;text-decoration:none}
.r + .r::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.r.ind + .r.ind::before{left:66px}
.r .main{flex:1;min-width:0}
.r .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:13px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:13px;color:var(--faint);flex:none}
.date{width:38px;flex:none;text-align:center;line-height:1.05}
.date b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.date span{font-size:11px;color:var(--sub)}
.date.we span{color:var(--rubysoft)}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:15px}
.err{background:var(--card);border-radius:12px;padding:16px;color:var(--ruby);font-size:15px;margin:8px 0}

/* カレンダー（アプリの直近N日と同じ作り） */
.cal{background:var(--card);border-radius:18px;padding:12px 8px 8px 0;position:relative}
.calbar{display:flex;align-items:center;gap:6px;padding:0 4px 6px 14px}
.calbar h1{font-size:22px;font-weight:700;margin:0;flex:1;white-space:nowrap}
.round{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--sub)}
.round svg{width:12px;height:12px}
.taskbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:44px;height:44px;border-radius:12px;background:var(--fill);color:var(--lapis);margin-left:4px}
.taskbtn svg{width:18px;height:18px}
.taskbtn b{font-size:12px;font-variant-numeric:tabular-nums;line-height:1}
.dayhead{display:grid;margin-left:44px}
.dayhead div{text-align:center;padding:2px 0 4px}
.dayhead .w{font-size:12px;color:var(--sub)}
.dayhead .n{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.dayhead .sun .w,.dayhead .sun .n{color:var(--rubysoft)}
.dayhead .today .n{background:var(--lapis);color:#fff}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px}
.grid{position:relative;margin-left:44px;border-top:.5px solid var(--grid)}
.ev{position:absolute;border-radius:8px;padding:3px 5px 3px 12px;overflow:hidden;font-size:12px;line-height:1.25;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.ev.short{flex-direction:row;gap:4px;align-items:center;padding-top:0;padding-bottom:0;white-space:nowrap}
.ev.short::before{display:none}.ev.short::after{top:50%;transform:translateY(-50%)}
.ev.short .ti{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.ev::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:currentColor;opacity:.8}
.ev::after{content:"";position:absolute;left:3.5px;top:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.ev .tm{font-weight:600;font-variant-numeric:tabular-nums}
.ev .ti{font-weight:700;font-size:13px;word-break:break-all}
.ev .en{position:absolute;bottom:3px;left:12px;font-weight:600;font-variant-numeric:tabular-nums}

/* 企業2列 */
.cos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.co{background:var(--card);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-height:64px}
.co b{font-size:15px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.co .foot{display:flex;align-items:center;gap:6px;min-height:8px}
.co .dl{font-size:12px;color:var(--ruby);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .spark{width:13px;height:13px;color:#8e6bd8;margin-left:auto;flex:none}
.steps{display:flex;gap:3px;flex:none}
.steps i{width:6px;height:6px;border-radius:50%;background:var(--fill)}
.steps i.on{background:var(--ink)}
.steps.end i.on{background:var(--rubysoft)}

/* 会のページ */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:6px 0 12px}
.seg button{text-align:center;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;position:relative}
.li + .li::before{content:"";position:absolute;top:0;left:34px;right:0;height:.5px;background:var(--sep)}
.li .dot{margin-top:7px}
.para{background:var(--card);border-radius:12px;padding:12px 16px;line-height:1.65}
.para p{margin:0 0 10px}.para p:last-child{margin:0}
.st{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;display:block;margin-top:12px}
.st:first-child{margin-top:0}
figure{margin:12px -12px}
figure .ph{width:100%;aspect-ratio:16/9;background:var(--fill);display:block}
figure img{width:100%;max-width:100%;display:block}
figcaption{font-size:12px;color:var(--sub);padding:5px 16px 0}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -12px}
.photos .ph,.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--fill)}
.muse{background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.6}
.muse h4{margin:10px 0 2px;font-size:14px}.muse h4:first-child{margin-top:0}
.muse p{margin:0 0 4px}
/* タスク（アプリと同じ丸） */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;position:relative}
.task + .task::before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--sep)}
.ring{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:1px}
.task .s{font-size:13px;color:var(--sub);margin-top:2px}
.due{color:var(--ruby)}
.upd{font-size:11px;color:var(--faint);text-align:center;margin-top:16px}
@media (min-width:640px){.cos{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 質感：押した時は少し沈む・画面は横から入る・吹き出しはばねで開く（動きは transform だけ） */
:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.3,1.12,.5,1)}
button,a.r{transition:transform .18s var(--ease),background-color .2s,opacity .2s}
button:active,a.r:active{transform:scale(.97)}
.r:active,.task:active{transform:none;background:var(--fill)}
.ev:active,.chip:active{transform:scale(.95)}
.co:active{transform:scale(.96)}
.in-push{animation:pushIn .38s var(--ease) both}
.in-pop{animation:popIn .32s var(--ease) both}
.in-next{animation:pageNext .34s var(--ease) both}
.in-prev{animation:pagePrev .34s var(--ease) both}
.in-flip{animation:flipIn .36s var(--ease) both}
@keyframes pushIn{from{transform:translateX(36%)}to{transform:none}}
@keyframes popIn{from{transform:translateX(-24%)}to{transform:none}}
@keyframes pageNext{from{transform:translateX(18%)}to{transform:none}}
@keyframes pagePrev{from{transform:translateX(-18%)}to{transform:none}}
@keyframes flipIn{from{transform:scale(.94)}to{transform:none}}
.seg{position:relative}
.seg .pill{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .32s var(--ease)}
.seg button{position:relative;z-index:1}
.seg button[aria-selected="true"]{background:none;box-shadow:none}

/* 表示の切り替え（日／月） */
.flip{height:30px;border-radius:15px;background:var(--fill);display:flex;align-items:center;padding:2px;gap:0;position:relative}
.flip span{position:relative;z-index:1;font-size:13px;font-weight:600;width:34px;text-align:center;color:var(--sub);transition:color .25s}
.flip span.on{color:var(--label)}
.flip i{position:absolute;top:2px;bottom:2px;left:2px;width:34px;border-radius:13px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .32s var(--ease)}
.flip.m i{transform:translateX(34px)}

/* 月 */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:0 6px 0 8px}
.month .wk{font-size:11px;color:var(--sub);text-align:center;padding:2px 0 6px}
.month .wk.sun{color:var(--rubysoft)}
.month .mday{min-height:64px;border-top:.5px solid var(--grid);padding:3px 1px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;border-radius:0}
.mday .n{align-self:center;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mday.out{opacity:.35}
.mday.sun .n{color:var(--rubysoft)}
.mday.today .n{background:var(--lapis);color:#fff}
.mday .bar{font-size:9.5px;line-height:1.35;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:600}
.mday .more{font-size:9.5px;color:var(--sub);text-align:center}

/* 吹き出し（アプリの予定の吹き出しと同じ作り） */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0);transition:background .25s}
.scrim.on{background:rgba(0,0,0,.18)}
.pop{position:fixed;z-index:21;width:min(300px,calc(100vw - 24px));background:var(--card);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.22),0 0 0 .5px var(--sep);padding:14px 16px 12px;transform-origin:var(--ox,50%) var(--oy,0);
  animation:popOpen .42s var(--spring) both}
.pop.out{animation:popClose .18s var(--ease) both}
@keyframes popOpen{from{transform:scale(.6)}to{transform:none}}
@keyframes popClose{to{transform:scale(.85);opacity:0}}
.pop .arrow{position:absolute;width:14px;height:14px;background:var(--card);transform:rotate(45deg);left:var(--ax,50%);margin-left:-7px}
.pop .arrow.up{top:-6px;box-shadow:-.5px -.5px 0 var(--sep)}
.pop .arrow.dn{bottom:-6px;box-shadow:.5px .5px 0 var(--sep)}
.pop h3{margin:0 0 2px;font-size:17px;font-weight:700;line-height:1.3;display:flex;gap:8px;align-items:flex-start}
.pop h3 .dot{margin-top:7px}
.pop .when{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.pop .row{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:8px;color:var(--label)}
.pop .row svg{width:15px;height:15px;color:var(--sub);flex:none;margin-top:2px}
.pop .act{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;height:38px;border-radius:10px;background:var(--fill);color:var(--lapis);font-size:15px;font-weight:600;width:100%;text-align:center}

/* タスク：押すと丸が埋まり、少しして行が畳まれる */
.task{transition:background-color .2s}
.task .ring{display:grid;place-items:center;transition:background-color .2s,border-color .2s,transform .25s var(--spring)}
.task .ring svg{width:12px;height:12px;color:#fff;transform:scale(0);transition:transform .3s var(--spring)}
.task.done .ring{background:var(--lapis);border-color:var(--lapis)!important;transform:scale(1.08)}
.task.done .ring svg{transform:none}
.task.done .tx{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--faint)}
.task .tx{transition:color .25s}
.task.gone{animation:collapse .32s var(--ease) forwards}
@keyframes collapse{to{transform:translateX(-12px);opacity:0;min-height:0;height:0;padding-top:0;padding-bottom:0}}
.task.wait .s .q{color:var(--sub)}
.addrow{display:flex;gap:12px;align-items:center;padding:8px 16px}
.addrow .plus{width:22px;height:22px;border-radius:50%;background:var(--lapis);color:#fff;display:grid;place-items:center;flex:none}
.addrow .plus svg{width:12px;height:12px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:17px;border:0;background:none;color:var(--label);padding:6px 0;outline:none}
.addrow input::placeholder{color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,0);background:rgba(30,30,32,.94);color:#fff;
  border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25);
  animation:toastIn .4s var(--spring) both;white-space:nowrap}
.toast button{color:#7fb2ff;font-weight:600;padding:4px 6px}
.toast.out{animation:toastOut .22s var(--ease) both}
@keyframes toastIn{from{transform:translate(-50%,140%)}to{transform:translate(-50%,0)}}
@keyframes toastOut{to{transform:translate(-50%,140%)}}
.note{font-size:12px;color:var(--sub);margin:8px 16px 0}
/* 企業のページ */
.prio{display:grid;grid-template-columns:auto repeat(5,1fr);align-items:center;gap:0;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 6px;position:relative}
.prio .lb{font-size:13px;color:var(--sub);padding:0 10px 0 8px}
.prio button{text-align:center;font-size:13px;font-weight:600;padding:6px 0;border-radius:7px;color:var(--sub);position:relative;z-index:1;transition:color .25s}
.prio button.on{color:var(--label);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prog{background:var(--card);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.prog .top{display:flex;align-items:center;gap:10px}
.prog .stg{font-size:17px;font-weight:700}
.prog .when{font-size:13px;color:var(--sub);margin-left:auto}
.prog .nx{font-size:15px;color:var(--ruby);font-weight:600}
.prog .pt{font-size:13px;color:var(--sub)}
.tl{position:relative}
.tl .li{padding:10px 16px 10px 16px}
.tl .d{font-size:12px;color:var(--sub);width:40px;flex:none;font-variant-numeric:tabular-nums;padding-top:2px}
.tl .w{font-size:15px}
.tl .sj{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.duec{display:inline-block;font-size:11px;font-weight:700;color:#8a6a00;background:rgba(255,204,0,.22);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
@media all{.duec{color:#ffd60a;background:rgba(255,214,10,.16)}}
.mail{display:block;padding:10px 16px;position:relative;color:inherit;text-decoration:none}
.mail + .mail::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.mail .h{display:flex;gap:8px;font-size:13px;color:var(--sub)}.mail .h span:last-child{margin-left:auto;flex:none}
.mail .sbj{font-size:15px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .sn{font-size:13px;color:var(--sub);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{display:block;width:100%;text-align:center;color:var(--lapis);font-size:15px;padding:11px 0;border-top:.5px solid var(--sep)}
.memo{background:var(--card);border-radius:12px;padding:4px 16px 8px}
.memo textarea{width:100%;min-height:96px;border:0;background:none;color:var(--label);font:inherit;font-size:16px;line-height:1.5;resize:none;outline:none;padding:8px 0}
.memo textarea::placeholder{color:var(--faint)}
.memo .st2{font-size:12px;color:var(--sub);text-align:right;min-height:16px;transition:opacity .3s}
.files .r .t{font-size:15px}
/* 自動で取り込んだ締切（黄色い枠のボタン） */
.dls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -12px 6px;padding-left:12px;padding-right:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dls::-webkit-scrollbar{display:none}
.dlb{flex:none;display:flex;flex-direction:column;gap:1px;min-width:132px;max-width:200px;padding:8px 11px;border-radius:12px;border:1.5px solid #f5c400;background:rgba(255,204,0,.10)}

.nev .ti{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,3)}
.nev.sh{flex-direction:row;align-items:center;gap:4px;white-space:nowrap;padding:1px 5px 1px 7px}
.nev.sh .ti{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal;-webkit-line-clamp:unset}
.nev.sh .tm{flex:0 0 auto}
.nev.narrow{padding:2px 3px 2px 6px;font-size:11px;line-height:1.2}
.nev.narrow .tm{font-size:11px}
/* 右下のパレット（押すと上へ開く・どの画面でも同じ場所） */
.fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:16;width:52px;height:52px;border-radius:26px;display:grid;place-items:center;color:var(--label);transition:transform .3s var(--ease),opacity .25s}
.fab svg{width:22px;height:22px}
.fab.hide{transform:translateY(90px);opacity:0;pointer-events:none}
.embedded .fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.pal{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:22;width:min(300px,calc(100vw - 28px));border-radius:24px;padding:10px;
  transform-origin:bottom right;animation:menuIn .34s var(--spring) both;max-height:70dvh;overflow:auto}
.embedded .pal{bottom:calc(154px + env(safe-area-inset-bottom,0px))}
.pal.out{animation:popClose .16s var(--ease) both}
.pal .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pal .pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:74px;border-radius:16px;background:var(--fill);font-size:12px;font-weight:600;text-align:center;padding:8px 4px;color:var(--label)}
.pal .pb svg{width:22px;height:22px;color:var(--lapis)}
.pal .pb.on{background:var(--lapis);color:#fff}.pal .pb.on svg{color:#fff}
.pal .ph2{font-size:12px;color:var(--sub);margin:10px 6px 6px}
.pal .pr{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;font-size:16px;color:var(--label);text-decoration:none}
.pal .pr:active{background:var(--hl)}
.pal .pr svg{width:18px;height:18px;color:var(--lapis);flex:none}
.pal .pr small{margin-left:auto;color:var(--sub);font-size:13px}
/* 右から出る企業の一覧 */
.drw{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(88vw,420px);background:#1c1c1e;box-shadow:-12px 0 40px rgba(0,0,0,.4);
  transform:translateX(105%);transition:transform .42s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drw.on{transform:none}
.drw .dh3{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 16px}
.drw .dh3 h2{flex:1;margin:0;font-size:24px;font-weight:700}
.drw .dh3 small{color:var(--sub);font-size:13px}
.drw .sfield{position:static;margin:0 12px 8px}
.drw .fl{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.drw .fl::-webkit-scrollbar{display:none}
.drw .fl button{flex:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:15px;background:var(--fill);color:var(--sub)}
.drw .fl button.on{background:var(--label);color:var(--bg)}
.drw .lst{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateZ(0);padding:0 0 calc(110px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.drw .cr{contain:paint;-webkit-transform:translateZ(0);display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;position:relative;min-height:56px}
.drw .cr + .cr::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.drw .cr .main{flex:1;min-width:0}
.drw .cr .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drw .cr .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.drw .cr .s .nx2{color:var(--ruby);font-weight:600}
.drw .cr .cobadge{width:26px;height:26px}
.drw .cr .cobadge.p0{display:grid;background:none}
/* 予定のシート：大きな操作の札・情報の行 */
.sheet .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:0 0 12px}
.sheet .ab{white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;border-radius:14px;background:#2c2c2e;color:var(--lapis);font-size:12px;font-weight:600;text-align:center;text-decoration:none;padding:6px}
.sheet .ab svg{width:22px;height:22px}
.sheet .ab.pri{background:var(--lapis);color:#fff}
.sheet .ab[disabled]{opacity:.45}
.sheet .rel{font-size:13px;color:var(--sub);margin-top:2px}
.sheet .nt{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55;padding:12px 16px}
.sheet .nt.fold{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.sheet .nt a{color:var(--lapis)}
.sheet .hint{font-size:12px;color:var(--sub);text-align:center;margin:-4px 0 12px}
/* その場で直す */
.edf{display:flex;flex-direction:column}
.edf label{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:48px;position:relative}
.edf label + label::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.edf label span{width:52px;flex:none;color:var(--sub);font-size:15px}
.edf input,.edf textarea{flex:1;min-width:0;border:0;background:none;color:var(--label);font:inherit;font-size:16px;outline:none;padding:12px 0;color-scheme:dark}
.edf textarea{min-height:110px;resize:none;line-height:1.5}
.edf .tm2{display:flex;gap:8px;align-items:center;flex:1}
.edf .tm2 input{flex:1}
.sheet .save{width:100%;min-height:50px;border-radius:14px;background:var(--lapis);color:#fff;font-size:17px;font-weight:600;text-align:center;margin:4px 0 8px}
.sheet .cancel{width:100%;min-height:44px;text-align:center;color:var(--lapis);font-size:16px}
/* 企業のページ：上に飛び先の帯・状態は1行・日程は1行 */
.cpage{padding:0 12px}
.chips{position:sticky;top:44px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;margin:0 -12px 4px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button,.chips a{flex:none;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:7px 12px;border-radius:16px;background:var(--card);color:var(--label);text-decoration:none}
.chips b{font-size:12px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--sub);margin:2px 4px 6px}
.stat .nx{color:var(--ruby);font-weight:700}
.stat .bad{color:var(--ruby)}
.er{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;position:relative;min-height:52px;text-align:left}
.er + .er::before{content:"";position:absolute;top:0;left:72px;right:0;height:.5px;background:var(--sep)}
.er .dd2{width:44px;flex:none;text-align:center;line-height:1.1}
.er .dd2 b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.er .dd2 span{font-size:11px;color:var(--sub)}
.er .dd2.we span{color:var(--rubysoft)}
.er .main{flex:1;min-width:0}
.er .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .s{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .lf{font-size:12px;font-weight:700;color:var(--lapis);flex:none}
.er.past{opacity:.6}
.er .bar3{width:3px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.cpage .sec{scroll-margin-top:100px}
/* 11-08 狭い幅（375pt・スクロールバー分も）でも右上の企業ボタンまで1行に収める */
@media (max-width:400px){.ntop{gap:6px;padding-left:8px;padding-right:8px}.cap.back{width:88px;padding:0 8px;font-size:16px}.cap .ib{width:40px}.nflip span,.nflip i{width:34px}.nflip.m i{transform:translateX(34px)}}
/* 11-08 ホーム画面のアプリ（全画面・上は時計の帯の下まで黒）：留まる札は時計の帯の下に留める */
.ntop,.nav{top:env(safe-area-inset-top,0px)}
.wk7{top:calc(58px + env(safe-area-inset-top,0px))}
.chips{top:calc(44px + env(safe-area-inset-top,0px))}
.drw{padding-top:env(safe-area-inset-top,0px)}
/* 11-08 実機の指摘 */
svg.spark{width:14px;height:14px;flex:none;color:#8e6bd8;vertical-align:-1px;margin-left:5px}
.large svg.spark{width:20px;height:20px}
.todayb{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:16;height:48px;padding:0 20px;border-radius:24px;font-size:16px;font-weight:600;color:var(--label)}
.embedded .todayb{display:none}
.stg{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px;background:color-mix(in srgb,var(--lapis) 18%,transparent);color:var(--lapis);white-space:nowrap}
.stg.go{background:color-mix(in srgb,var(--emerald) 18%,transparent);color:var(--emerald)}
.stg.end{background:var(--fill);color:var(--sub)}
.drw .cr .cobadge,.cobadge{display:none!important}
/* 予定のシート（純正）：上に ✕ と「編集」・行で並べる */
.sheet .shd{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 6px}
.sheet .shd .ed{height:40px;padding:0 16px;border-radius:20px;font-size:16px;font-weight:600;color:var(--label)}
.sheet .shd .cx{color:var(--lapis);font-size:17px;padding:8px 4px}
.sheet .shd .dn{color:var(--lapis);font-size:17px;font-weight:700;padding:8px 4px}
.sheet .shd .shr{display:flex;gap:8px}.sheet .shd .ed{height:44px;border-radius:22px}
.sheet .shd h3{margin:0;font-size:17px;font-weight:600}
.sheet .r .ico{width:22px;height:22px;color:var(--lapis);flex:none}
.sheet .r .ico svg{width:22px;height:22px}
.sheet .r[disabled]{opacity:.45}
.sheet .r .t.lk{color:var(--lapis)}
/* 重なった予定：押した予定を前へ・前の予定を薄く */
.nev.dim{opacity:.28}
.nev.front{z-index:40!important;box-shadow:0 0 0 2px var(--c),0 6px 18px rgba(0,0,0,.5)}
/* 丸い枠のアイコンから広がる入力（新しい電池表示の作法） */
.mo{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px}
.mo + .mo::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--sep)}
.mob{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--fill);color:var(--lapis);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .2s var(--ease)}
.mob svg{width:19px;height:19px}.mob:active{transform:scale(.9)}
.mob .cdot{width:14px;height:14px;border-radius:7px;display:block}
.mol{font-size:16px;flex:1;color:var(--label)}
.mov{font-size:16px;color:var(--sub);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.moi{position:absolute;left:14px;top:8px;bottom:8px;width:36px;border-radius:18px;background:#3a3a3c;overflow:hidden;opacity:0;pointer-events:none;
  transition:width .5s var(--spring),opacity .18s,border-radius .5s var(--spring);display:flex;align-items:center;padding-left:44px}
.mo.open .moi{width:calc(100% - 28px);opacity:1;pointer-events:auto;border-radius:14px}
.mo.open .mov,.mo.open .mol{opacity:0}
.moi input,.moi select{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--label);font:inherit;font-size:16px;outline:none;color-scheme:dark;padding-right:12px}
.mo.open .mob{position:relative;z-index:2;background:var(--lapis);color:#fff}
.delrow{display:block;width:100%;margin:14px 0 8px;min-height:50px;border-radius:14px;background:#2c2c2e;color:#ff453a;font-size:17px;text-align:center}
/* 確認の札 */
.cfm{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:41;transform:translateY(120%);transition:transform .42s var(--spring)}
.cfm.on{transform:none}
.cfm .cg{background:rgba(44,44,46,.96);border-radius:14px;overflow:hidden;margin-bottom:8px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.cfm .cm{font-size:13px;color:var(--sub);text-align:center;padding:14px 16px}
.cfm .cd{display:block;width:100%;min-height:56px;border-top:.5px solid var(--sep);color:#ff453a;font-size:19px;text-align:center}
.cfm .cc{display:block;width:100%;min-height:56px;border-radius:14px;background:#2c2c2e;color:var(--lapis);font-size:19px;font-weight:600;text-align:center}
/* 重なった予定の小さな一覧 */
.pop.stack{padding:6px;width:min(260px,calc(100vw - 24px))}
.sti{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:9px 10px 9px 14px;border-radius:10px;position:relative;text-align:left}
.sti::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--c)}
.sti:active{background:var(--hl);transform:none}
.stt{font-size:15px;font-weight:600;line-height:1.3}.sts{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.chips button svg,.chips a svg{width:16px;height:16px;color:var(--lapis);flex:none}
.sec.sh{display:flex;align-items:center;gap:6px}
.sec.sh svg{width:15px;height:15px;color:var(--sub)}
.qe{cursor:pointer;border-radius:10px;transition:background-color .2s}
.qe:active{background:var(--hl)}
.mob.neutral,.mo.open .mob.neutral{background:var(--fill)}
.cdot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:10px;vertical-align:-1px;flex:none}
.mob .cdot{margin:0;width:16px;height:16px;border-radius:8px}
.pop.cals .stt{display:flex;align-items:center}
.pop.cals .sti{flex-direction:row;justify-content:space-between;align-items:center;padding-left:10px}
.pop.cals .sti::before{display:none}
.ck2{color:var(--lapis);font-weight:700}
.pop.cals{max-height:60vh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.sheet.swap > *{animation:swapIn .32s var(--ease) both}
.sheet.swap > *:nth-child(3){animation-delay:.02s}.sheet.swap > *:nth-child(4){animation-delay:.04s}.sheet.swap > *:nth-child(n+5){animation-delay:.06s}
@keyframes swapIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mo.open .mob{animation:moPop .45s var(--spring)}
@keyframes moPop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:none}}
.delrow:active,.ed:active,.cx:active,.dn:active{transform:scale(.97);opacity:.8}
.moi.moc{gap:6px;overflow-x:auto;scrollbar-width:none;padding-right:8px;-webkit-overflow-scrolling:touch}
.moi.moc::-webkit-scrollbar{display:none}
.chp{flex:none;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.08);color:var(--label);font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .2s,transform .2s var(--spring)}
.chp.on{background:var(--lapis);color:#fff;font-weight:600}
.chp:active{transform:scale(.92)}
/* ── 編集の板（案10）── */
.brd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:none!important;padding:0!important;overflow:visible!important}
.brd .mo{--k:var(--lapis);flex-direction:column;justify-content:center;gap:3px;min-height:100px;padding:12px 4px 10px;background:#2c2c2e;border-radius:20px;text-align:center;will-change:transform}
.brd .mo::before{display:none!important}
.brd .mo.w{grid-column:span 2;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;row-gap:0;align-content:center;justify-content:stretch;text-align:left;padding:10px 12px;min-height:76px}
.brd .mo.w .mob{grid-row:1/3}
.brd .mo.w .mov{order:0;grid-column:2;grid-row:1;font-size:21px;font-weight:600;max-width:none;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.brd .mo.w .mol{grid-column:2;grid-row:2;font-size:12px;margin:0}
.brd .mo[data-mo="d"] .mov,.brd .mo[data-mo="rr"] .mov{font-size:16px;letter-spacing:-.3px}
.brd .mol{order:3;flex:none;font-size:11.5px;color:var(--sub);margin-top:1px}
.brd .mov{order:2;font-size:13px;font-weight:600;color:var(--label);max-width:100%}
.brd .mob{width:44px;height:44px;border-radius:22px;align-self:center;background:color-mix(in srgb,var(--k) 20%,transparent);color:var(--k);box-shadow:inset 0 0 0 2px var(--k);transition:background-color .3s,box-shadow .3s,color .3s,transform .2s var(--ease)}
.brd .mob svg{width:22px;height:22px}
.brd .mo.off .mob{background:transparent;color:#8e8e93;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
.brd .mo.off .mov{color:var(--sub);font-weight:500}
.brd .mo[data-mo="d"]{--k:#ff453a}.brd .mo[data-mo="a"],.brd .mo[data-mo="b"]{--k:#30d158}.brd .mo[data-mo="loc"]{--k:#0a84ff}
.brd .mo[data-mo="tt"]{--k:#64d2ff}.brd .mo[data-mo="al"]{--k:#ff9f0a}.brd .mo[data-mo="rr"]{--k:#bf5af2}
.brd .mob.neutral{background:color-mix(in srgb,var(--k) 20%,transparent)!important}
.brd .mob .cdot{width:18px;height:18px;border-radius:9px}
.brd .mo:active{transform:scale(.97)}
.brd .mo.open{grid-column:1/-1;display:flex;flex-direction:row;min-height:66px;padding:0 12px}
.brd .mo.open .mob{background:var(--k);color:#fff;box-shadow:none}
.brd .moi{left:12px;top:11px;bottom:11px;width:44px;border-radius:22px;background:#3a3a3c}
.brd .mo.open .moi{width:calc(100% - 24px);border-radius:22px;padding-left:52px}
.brd .mo.open .moi{display:flex;align-items:center;gap:6px}
.brd .chp.on{background:var(--k)}
.durs{display:flex;gap:4px;flex:none;padding-right:6px}
.durs .chp{height:28px;padding:0 9px;font-size:12.5px}
.brd .mo[data-mo="b"].open .moi input{flex:0 0 86px}
.okdock{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;pointer-events:none;margin-top:-56px;height:56px;z-index:3}
.okb{pointer-events:auto;width:56px;height:56px;border-radius:28px;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .2s var(--spring)}
.okb svg{width:24px;height:24px}.okb:active{transform:scale(.88)}.okb:disabled{opacity:.5}
.msearch{margin:0 16px 8px}.msearch input{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:inherit;font-size:16px;padding:0 12px;outline:none}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;min-height:60px}
.mrow+.mrow{border-top:.5px solid var(--sep)}.mrow:active{background:var(--hl)}
.ibc{margin:0 16px 10px;border-radius:14px;background:var(--card);overflow:hidden}
.ibm{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}.ibm:active{background:var(--hl)}
.ibbar{flex:none;width:4px;align-self:stretch;border-radius:2px}
.ibm .msum svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;opacity:.7}
.ibb{display:flex;gap:8px;padding:0 14px 12px}.ibb button{flex:1;height:40px;border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}

:root{--klapis:#215abd;--klapisL:#70a3fa;--klapisD:#122e80;--kruby:#c06a78;--kout:cubic-bezier(.22,.61,.36,1);--kspring:cubic-bezier(.3,1.15,.55,1)}

.ktick{animation:ktick .22s var(--kspring)}@keyframes ktick{0%{transform:scale(.9)}100%{transform:none}}

.kdch button.arm{background:rgba(33,90,189,.24);color:var(--klapisL)}
.kmh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}.kmh b{font-size:17px}.kmh button{width:34px;height:34px;border-radius:17px;color:var(--klapisL);font-size:20px}
.kg7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kg7.ranging{touch-action:none}
.kw{font-size:11px;color:var(--sub);padding:2px 0 4px}.kw.arm{animation:karm 1s ease-in-out infinite alternate;color:var(--klapisL);border-radius:6px}
@keyframes karm{from{background:rgba(33,90,189,.05)}to{background:rgba(33,90,189,.3)}}
.kd{position:relative;height:38px;display:grid;place-items:center;font-size:16px;font-variant-numeric:tabular-nums;color:var(--label)}
.kd span{position:relative;width:34px;height:34px;line-height:34px;border-radius:17px;transition:background-color .14s var(--kout),color .14s var(--kout),transform .22s var(--kspring)}
.kd.we{color:var(--kruby)}.kd.wed{color:var(--klapisL)}.kd.out{opacity:.3}
.kd.td span{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.kd.sel span,.kd.rs span,.kd.re span{background:var(--klapis);color:#fff;font-weight:700}
.kd::before{content:"";position:absolute;left:-1px;right:-1px;top:3px;bottom:3px;background:rgba(33,90,189,.28);opacity:0;transform:scaleX(.3);transition:opacity .14s var(--kout),transform .22s var(--kout)}
.kd.rng::before{opacity:1;transform:none}.kd.rs::before{left:50%}.kd.re::before{right:50%}.kd.rs.re::before{display:none}
.kd:nth-child(7n+8)::before{border-radius:10px 0 0 10px}.kd:nth-child(7n+14)::before{border-radius:0 10px 10px 0}
.kd.ev::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--sub)}
.kd.press span{transform:scale(1.14)}.kg7.hold .kd:not(.rng){opacity:.55;transition:opacity .22s var(--kout)}
.kchs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 12px;overscroll-behavior-x:contain}.kchs::-webkit-scrollbar{display:none}
.kc{flex:none;height:32px;padding:0 13px;border-radius:16px;background:rgba(255,255,255,.08);font-size:14px;font-weight:500;color:var(--label)}
.kc.on{background:#fff;color:#000;font-weight:600}
.kph{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 10px}.kph .kt{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#3a3a3c}.kph img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion: reduce){.ke *,.ke *::before{animation:none!important;transition-property:opacity,background-color,color!important;transition-duration:.12s!important}.khand{transition:none!important}.ke button:active:not(:disabled){transform:none}}
@media (max-width:340px){.ktm{padding:0 8px}.kdp{padding:2px 6px 12px}.kdch button{font-size:12px}}
/* ── 11-21 Muse V4 UX・2pxロードバー・スケルトン・階層カード・未確定区分 ── */
:root{--muse:#8e9cf8;--tent:#ff7043;--grid:rgba(235,235,245,.08);--card2:#2c2c2e;--spring4:cubic-bezier(.22,1,.36,1)}
.loadbar{
  position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:0;z-index:45;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,var(--lapis),var(--muse),var(--lapis));background-size:200% 100%;
  box-shadow:0 0 8px rgba(112,163,250,.55);transition:width .35s var(--spring4),opacity .25s ease;
}
.loadbar.on{opacity:1;animation:barSweep 1.2s linear infinite}
@keyframes barSweep{0%{background-position:0% 0}100%{background-position:200% 0}}
.sk{position:relative;overflow:hidden;background:#202023;border-radius:8px}
.sk::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.065) 50%,transparent 100%);
  animation:skShimmer 1.3s var(--ease) infinite;
}
@keyframes skShimmer{100%{transform:translateX(100%)}}
.sk-ev{position:absolute;left:3px;right:3px;border-radius:7px;background:#242428;border-left:2.5px solid rgba(112,163,250,.35)}
.reveal{animation:floatIn .42s var(--spring4) calc(var(--stagger,0) * 32ms) both}
@keyframes floatIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
/* Sleek stacked typographic .dd2 (12月 / 3 / 木) */
.dd2{width:40px;flex:none;text-align:center;line-height:1.05;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:1px}
.dd2 .m{font-size:10px;font-weight:600;color:var(--faint)}
.dd2 b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em}
.dd2 .w{font-size:10.5px;font-weight:600;color:var(--sub)}
.dd2.we .w,.dd2.we b,.er .dd2.we b,.er .dd2.we span{color:var(--rubysoft)}
.dd2.due b{color:var(--ruby)}
/* Tentative (仕分け箱・未確定 / 仮押さえ) distinction */
.nev.tentative{
  border-top:1px dashed var(--tent)!important;border-right:1px dashed var(--tent)!important;border-bottom:1px dashed var(--tent)!important;
  background-image:repeating-linear-gradient(-45deg,rgba(255,112,67,.2) 0 4px,rgba(255,112,67,.06) 4px 8px)!important;
}
.nev .tbadge{font-size:9px;font-weight:700;padding:0 4px;border-radius:4px;background:rgba(255,112,67,.28);color:#ffb9a2;margin-left:auto}
.nlist .it.tentative,.mle.tentative{border:1px dashed rgba(255,112,67,.5)}
/* Sticky .chips with Muse pill */
.chips{border-bottom:.5px solid rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(0,0,0,.9)}
.chips button,.chips a{border:.5px solid rgba(255,255,255,.06)}
.chips button.muse-chip svg{color:var(--muse)}
.chips button.on{background:rgba(112,163,250,.18);border-color:rgba(112,163,250,.4);color:#fff}
.chips button.muse-chip.on{background:rgba(142,156,248,.22);border-color:rgba(142,156,248,.48)}
.cpage .sec{scroll-margin-top:104px}
svg.spark{color:var(--muse)}
/* ID Bar */
.id-bar{margin:10px 0 6px;background:var(--card);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;border:.5px solid var(--sep)}
.id-bar .id-meta{flex:1;min-width:0}
.id-top{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.id-badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:99px;white-space:nowrap;flex:none}
.id-badge.ok{background:rgba(79,184,148,.16);color:var(--emerald)}
.id-badge.guess{background:rgba(214,171,94,.18);color:var(--topaz)}
.id-val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-btns{display:flex;gap:5px;flex:none}
.ic-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 9px;border-radius:10px;background:var(--card2);color:var(--lapis);font-size:12.5px;font-weight:600;white-space:nowrap}
.ic-btn svg{width:14px;height:14px;flex:none}
.ic-btn.pri{background:var(--lapis);color:#fff}
/* Section Headers & 整理 / 従来 toggle */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 4px 8px}
.sec-head .sec{margin:0;display:inline-flex;align-items:center;gap:6px}
.sec-head .sec svg{width:15px;height:15px;color:var(--sub);flex:none}
.seg-sm{display:inline-flex;background:var(--fill);padding:2px;border-radius:8px;gap:2px}
.seg-sm button{font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;color:var(--sub)}
.seg-sm button.on{background:var(--card);color:var(--label)}
/* Default-Collapsed Accordion Muse Cards */
.ev-list{display:flex;flex-direction:column;gap:10px}
.mcard{background:var(--card);border-radius:16px;padding:13px 14px;width:100%;border:.5px solid var(--sep);display:flex;flex-direction:column;gap:9px}
.mcard.is-hold{opacity:.72;border-color:rgba(214,171,94,.38);background:#161618}
.mcard.is-closed{opacity:.68}
.mcard-hd{cursor:pointer;display:flex;flex-direction:column;gap:5px}
.mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mcard-title{font-size:16px;font-weight:700;line-height:1.3;margin:0}
.mcard-summary{font-size:13px;color:var(--sub);line-height:1.4}
.mcard-tags{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--faint)}
.mcard-tags span{display:inline-flex;align-items:center;gap:4px}
.mcard-tags svg{width:12px;height:12px;flex:none}
.badges-r{display:flex;align-items:center;gap:5px;flex:none}
.slot-cnt{font-size:11.5px;font-weight:600;color:var(--sub);background:var(--fill);padding:3px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.feas{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.feas.ok{background:rgba(79,184,148,.18);color:var(--emerald)}
.feas.tight{background:rgba(214,171,94,.2);color:var(--topaz)}
.feas.conflict{background:rgba(242,87,112,.18);color:var(--ruby)}
.feas.hold{background:rgba(214,171,94,.16);color:var(--topaz);border:.5px solid rgba(214,171,94,.35)}
.feas.closed{background:var(--fill);color:var(--sub)}
.mcard-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:.5px solid rgba(255,255,255,.06)}
.exp-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--lapis);padding:5px 2px}
.exp-btn svg{width:13px;height:13px;transition:transform .22s var(--ease)}
.mcard.open .exp-btn svg{transform:rotate(180deg)}
.quick-acts{display:flex;gap:6px;flex:none}
.qbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9px;background:var(--card2);color:var(--sub)}
.qbtn svg{width:12px;height:12px;flex:none}
.qbtn.hold.on{background:rgba(214,171,94,.22);color:var(--topaz);border:.5px solid rgba(214,171,94,.4)}
.qbtn.drop{color:var(--rubysoft)}
/* Expanded Slots + 2-track 07:00–23:00 DayBar */
.slot-list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.slot-box{background:rgba(255,255,255,.03);border-radius:12px;padding:10px;border:.5px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.slot-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slot-dt{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.slot-dt .d{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.slot-dt .wd{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--fill);color:var(--sub)}
.slot-dt .wd.we{color:var(--rubysoft);background:rgba(242,87,112,.14)}
.slot-dt .tm{font-size:13px;font-weight:500;color:var(--ink)}
.slot-cue{font-size:12px;color:var(--sub)}
.slot-cue.tent{color:#ff9b7a;font-weight:600}
.daybar-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;margin-bottom:2px}
.daybar{position:relative;height:28px;border-radius:6px;background:#121214;border:.5px solid var(--grid);overflow:hidden}
.daybar .blk{position:absolute;top:2px;height:11px;border-radius:4px;font-size:8.5px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 3px}
.daybar .blk.cand{top:14px;height:11px;font-size:9px}
.blk.tentative{border-style:dashed!important;background-image:repeating-linear-gradient(-45deg,rgba(255,112,67,.24) 0 4px,rgba(255,112,67,.08) 4px 8px)!important}
.blk.cand-ok{background:rgba(79,184,148,.34);color:#d7fff0;border:1px solid var(--emerald)}
.blk.cand-tight{background:rgba(214,171,94,.36);color:#fff2d6;border:1px solid var(--topaz)}
.blk.cand-conflict{background:rgba(242,87,112,.38);color:#ffe0e5;border:1px solid var(--ruby)}
.blk.cand-closed{background:rgba(142,142,147,.25);color:var(--sub);border:.5px dashed var(--faint)}
.slot-foot{display:flex;align-items:center;justify-content:space-between;padding-top:2px}
.slot-detail-hint{font-size:11.5px;color:var(--faint)}
.join-pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(112,163,250,.18);color:var(--lapis);border:.5px solid rgba(112,163,250,.35)}
/* Compact Muse Request Hub & Collapsed 原文 */
.hub{background:var(--card);border-radius:14px;padding:12px;border:.5px solid var(--sep);margin-top:10px}
.preset-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.preset{padding:6px 10px;border-radius:9px;background:rgba(142,156,248,.13);color:#cdd3ff;font-size:12.5px;font-weight:600;border:.5px solid rgba(142,156,248,.28)}
.hub-form{display:flex;gap:8px;align-items:center}
.hub-form input{flex:1;min-width:0;height:38px;border-radius:10px;background:#111113;color:var(--label);border:.5px solid var(--sep);padding:0 11px;font:inherit;font-size:14px;outline:none}
.hub-send{width:38px;height:38px;border-radius:10px;background:var(--muse);color:#111;display:grid;place-items:center;flex:none}
.hub-send svg{width:17px;height:17px}
.req-log{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.req-item{font-size:12.5px;padding:7px 10px;border-radius:9px;background:#121214;border:.5px solid var(--sep);display:flex;justify-content:space-between;gap:8px}
.req-item b{color:var(--muse);font-weight:600}
details.raw-muse{margin-top:10px;background:var(--card);border-radius:12px;border:.5px solid var(--sep);overflow:hidden}
details.raw-muse summary{padding:11px 14px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.raw-muse summary::-webkit-details-marker{display:none}
details.raw-muse summary svg{width:14px;height:14px;transition:transform .2s var(--ease)}
details.raw-muse[open] summary svg{transform:rotate(180deg)}
details.raw-muse pre{margin:0;padding:0 14px 12px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--sub);line-height:1.55}
/* Detail Sheet Day Timeline */
.timeline-card{background:#242426;border-radius:14px;padding:12px 14px;border:.5px solid var(--sep);margin:10px 0 12px}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tl-slot-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tl-tab{padding:5px 10px;border-radius:9px;font-size:12px;font-weight:600;background:var(--fill);color:var(--sub);font-variant-numeric:tabular-nums}
.tl-tab.on{background:var(--lapis);color:#fff}
.dtl{position:relative;margin-left:44px;border-left:.5px solid var(--sep);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.dtl-row{position:relative;border-radius:10px;padding:8px 10px;background:#121214;border:.5px solid var(--grid);border-left-width:3px}
.dtl-row.tentative{border-style:dashed!important;border-left-width:3px!important;background-image:repeating-linear-gradient(-45deg,rgba(255,112,67,.16) 0 5px,rgba(255,112,67,.05) 5px 10px)!important}
.dtl-row.cand{border-width:1.5px;border-left-width:3px}
.dtl-row.cand.ok{background:rgba(79,184,148,.14);border-color:var(--emerald)}
.dtl-row.cand.tight{background:rgba(214,171,94,.16);border-color:var(--topaz)}
.dtl-row.cand.conflict{background:rgba(242,87,112,.16);border-color:var(--ruby)}
.dtl-row.cand.closed{background:rgba(142,142,147,.16);border-color:var(--faint)}
.dtl-row.free{background:transparent;border:.5px dashed var(--grid);color:var(--sub);font-size:12px;padding:5px 10px}
.dtl-tm{position:absolute;left:-52px;top:8px;width:38px;text-align:right;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.dtl-ttl{font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.cat-tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px}
.cat-tag.tent{background:rgba(255,112,67,.22);color:#ffae95;border:.5px dashed rgba(255,112,67,.6)}
.dtl-meta{font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.sheet .acts.muse-acts{grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0 4px}
.sheet .acts.muse-acts .ab{flex-direction:row;min-height:46px;border-radius:13px;font-size:13.5px;gap:6px;padding:8px 10px;color:var(--label)}
.sheet .acts.muse-acts .ab svg{width:15px;height:15px}
.sheet .acts.muse-acts .ab.pri{background:var(--muse);color:#111;font-weight:700}
.sheet .acts.muse-acts .ab.cal{background:rgba(112,163,250,.18);color:var(--lapis)}
.sheet .acts.muse-acts .ab.hold.on{background:rgba(214,171,94,.24);color:var(--topaz);border:1px solid var(--topaz)}
.sheet .acts.muse-acts .ab.skip{color:var(--rubysoft)}
.sec-note{border-radius:12px;padding:9px 12px;background:rgba(214,171,94,.14);border:.5px solid rgba(214,171,94,.42);color:#ffe3a8;font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-note svg{width:15px;height:15px;flex:none;color:var(--topaz)}
.fld-grp{background:#2c2c2e;border-radius:14px;padding:10px 14px;margin-bottom:10px;border:.5px solid var(--sep)}
.fld-grp label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px}
.fld-grp input,.fld-grp textarea{width:100%;background:#111113;color:var(--label);border:.5px solid var(--sep);border-radius:10px;padding:8px 10px;font:inherit;font-size:14.5px;outline:none}
.sheet .save.muse{background:var(--muse);color:#111;font-weight:700}

/* 議事録要点の視認性（マーカー・色分け・カード・アクション強調） */
.m-wrap{overflow-wrap:anywhere}
.m-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:2px 2px 12px}
.m-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.75rem;color:var(--sub)}
.m-legend-it{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.m-sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.m-sw.key{background:var(--mk-key-bg);border-bottom:2px solid var(--mk-key-line)}
.m-sw.due{background:var(--mk-due-bg);border-bottom:2px solid var(--mk-due-line)}
.m-sw.person{background:var(--hl-person)}
.m-sw.num{background:var(--hl-num)}
.m-tog{min-block-size:2rem;padding:.3em .75em;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid var(--sep);background:var(--card);color:var(--sub);display:inline-flex;align-items:center;gap:5px;flex:none}
.m-tog[aria-pressed="true"]{border-color:rgba(214,171,94,.55);background:var(--mk-key-bg);color:var(--mk-key-fg)}
@media (pointer:coarse){.m-tog{min-block-size:44px;min-inline-size:44px;padding:.45em .95em}}
h2.sec.m-sec{margin:18px 6px 8px;font-size:.82rem;font-weight:700;letter-spacing:.03em;color:var(--sub);display:flex;align-items:center;gap:7px;text-wrap:balance}
.m-sec-bar{width:3px;height:13px;border-radius:2px;flex:none}
.m-stack{display:flex;flex-direction:column;gap:10px}
.mcard-p{background:var(--card);border-radius:14px;padding:13px 15px 13px 16px;border:.5px solid var(--m-card-bd);border-left:3px solid var(--m-accent,var(--sep));color:var(--m-body);font-size:.96rem;line-height:1.75}
.mcard-p.t-lapis{--m-accent:var(--lapis)}
.mcard-p.t-ruby{--m-accent:var(--ruby)}
.mcard-p.t-emerald{--m-accent:var(--emerald)}
.mcard-p.t-topaz{--m-accent:var(--topaz)}

.mcard-p p{margin:0 0 .68em;text-wrap:pretty}.mcard-p p:last-child{margin-bottom:0}
.m-badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;line-height:1.3;padding:.18em .62em;border-radius:999px;margin:0 0 8px}
.m-badge svg{width:12px;height:12px;flex:none}

<body>
<div class="loadbar on" id="loadbar" style="width:32%"></div>
<div class="wrap">
  <header class="nav" id="nav" hidden><div><button class="back" id="back">‹ <span id="backl">戻る</span></button></div><div class="mid" id="mid"></div><div></div></header>
  <main id="main"><div class="ncal" style="padding:10px 8px 12px"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">読み込み中</span><div class="sk" style="height:40px;border-radius:20px;margin:2px 4px 10px"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:380px;margin-left:40px"><div style="position:relative;border-left:.5px solid var(--grid)"><div class="sk sk-ev" style="top:40px;height:70px"></div><div class="sk sk-ev" style="top:180px;height:90px"></div></div><div style="position:relative;border-left:.5px solid var(--grid)"><div class="sk sk-ev" style="top:95px;height:75px"></div><div class="sk sk-ev" style="top:240px;height:80px"></div></div><div style="position:relative;border-left:.5px solid var(--grid)"><div class="sk sk-ev" style="top:60px;height:65px"></div><div class="sk sk-ev" style="top:200px;height:85px"></div></div></div></div><div class="cos" style="margin-top:12px"><div class="co"><div class="sk" style="height:16px;width:70%"></div><div class="sk" style="height:12px;width:45%;margin-top:8px"></div></div><div class="co"><div class="sk" style="height:16px;width:62%"></div><div class="sk" style="height:12px;width:52%;margin-top:8px"></div></div></div></main>
</div>
<script>
/* 11-08 どこかで落ちたら「読み込み中」のまま黙らせない＝理由を画面に出す */
window.onerror = (msg, src, line, col) => { const m = document.getElementById("main"); if (m && /読み込み中/.test(m.textContent)) m.innerHTML = `<div class="err">画面の読み込みで止まりました：${String(msg).replace(/[<>&]/g, "")}（${line}:${col}）</div>`; };
window.addEventListener("unhandledrejection", e => window.onerror(String(e.reason && (e.reason.stack || e.reason.message) || e.reason), "", 0, 0));
/* データの口：Apps Script ならドライブから、手元の試験なら data/ から読む */
try { if (window.self !== window.top) document.documentElement.classList.add("embedded"); } catch (e) { document.documentElement.classList.add("embedded"); }
const GAS = typeof google !== "undefined" && google.script && google.script.run;
const call = (fn, ...a) => new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...a));
/* 🔗11-08 自前のページ（GitHub Pages・ホーム画面のアプリ）からは、Apps Script の窓口を鍵で読む。
   鍵と窓口の URL は初回だけ「#k=鍵&u=窓口」で渡し、この端末に覚える（ページのコードには鍵を書かない）。 */
const CONF = (() => { let c = {}; try { c = JSON.parse(localStorage.getItem("apiConf") || "{}"); } catch (e) {}
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("k") && h.get("u")) { c = {k: h.get("k"), u: h.get("u")}; try { localStorage.setItem("apiConf", JSON.stringify(c)); } catch (e) {} try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  return c; })();
const API = !GAS && CONF.k && CONF.u;
const remote = (q) => fetch(`${CONF.u}?${new URLSearchParams({...q, k: CONF.k})}`, {cache: "no-store"}).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || "読めませんでした"); return j.data; });
const remoteOp = o => fetch(CONF.u, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({k: CONF.k, op: o})}).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || "送れませんでした"); return j.data; });
const api = {
  index: st => GAS ? call("getIndex", st) : API ? remote({fn: "index", st: st || 0}) : fetch("data/index.json", {cache: "no-store"}).then(r => r.text()).then(t => ({stamp: t.length, text: t})),
  muse: ms => GAS ? call("getMuse", ms) : API ? remote({fn: "muse", st: ms || 0}) : Promise.resolve({museStamp: 0}),
  sync: (st, ms, gs, ts) => GAS ? call("getSync", st, ms, gs, ts) : remote({fn: "sync", st: st || 0, ms: ms || 0, gs: gs || "", ts: ts || ""}),
  part: (name, st) => GAS ? call("getPart", name, st) : API ? remote({fn: "part", name, st: st || 0}) : fetch(`data/${name}.json`, {cache: "no-store"}).then(r => r.ok ? r.text() : null).then(t => ({stamp: t ? t.length : 0, text: t})),
  meet: id => GAS ? call("getMeet", id) : API ? remote({fn: "meet", id}) : fetch(`data/meet/${id}.json`).then(r => r.ok ? r.text() : null),
  img: n => GAS ? call("getImg", n) : API ? remote({fn: "img", id: n}) : Promise.resolve(`data/img/${n}`),
  op: o => GAS ? call("addOp", o) : API ? remoteOp(o) : Promise.resolve(true),
};
/* 🔗11-18 Google Tasks のタスク（gid あり）の完了・戻すは窓口がその場で Google へ当てる。Mac も知っているタスクなら Mac にも頼む */
const taskMeta = {};
{ const op1 = api.op; api.op = o => {
  if ((o.op === "done" || o.op === "undone")) {
    const t = (typeof D !== "undefined" && D && D.tasks && D.tasks.find(x => x.id === o.id)) || taskMeta[o.id] || (String(o.id || "").startsWith("g:") ? {gid: String(o.id).slice(2), g: true} : null);
    if (t && t.gid) { const g = op1({op: o.op === "done" ? "gtdone" : "gtundone", gid: t.gid}); if (t.g) return g; g.catch(() => {}); }
  }
  return op1(o);
}; }

/* iPhone で押した頼み（Mac が反映するまでの間もそう見せる）。端末に覚えるので閉じても消えない */
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const norm = t => String(t ?? "").normalize("NFKC").toLowerCase();
const nfc = s => String(s ?? "").normalize("NFC");
const coKeys = c => { const s = new Set(); if (!c) return []; for (const w of [c.name, ...(c.folders || []), ...(c.aliases || [])]) if (w) s.add(nfc(w)); return [...s]; };
const coSearchText = c => [c.name, ...(c.folders || []), ...(c.aliases || [])].filter(Boolean).join(" ");
function findCo(name) {
  if (!D || !name) return null;
  const k = nfc(name), nk = norm(k);
  return D.companies.find(c => nfc(c.name) === k)
    || D.companies.find(c => (c.folders || []).some(f => nfc(f) === k) || (c.aliases || []).some(a => norm(a) === nk));
}
function museOf(c) {
  if (!c) return "";
  let best = "", bestT = -1;
  for (const k of coKeys(c)) if (MUSE[k]) {
    const t = MUSEMT[k] || 0;
    if (!best || t > bestT) { best = MUSE[k]; bestT = t; }
  }
  return best || c.muse || "";
}
function filesOf(c) {
  if (!c) return [];
  const seen = new Set(), out = [];
  for (const k of coKeys(c)) for (const f of (FILES[k] || [])) {
    const id = f.u || f.n;
    if (!seen.has(id)) { seen.add(id); out.push(f); }
  }
  return out.sort((a, b) => (b.t || 0) - (a.t || 0));
}
let pendDone = store.get("pendDone", {}), pendAdd = store.get("pendAdd", []), gtkLoaded = false;
function prunePending() {
  if (!D) return;
  const ids = new Set(D.tasks.map(t => t.id)), texts = new Set(D.tasks.map(t => t.t)), day = 864e5 * 3;
  for (const id in pendDone) {
    if (String(id).startsWith("g:") && !gtkLoaded && Date.now() - pendDone[id] <= day) continue;
    if (!ids.has(id) || Date.now() - pendDone[id] > day) delete pendDone[id];   // Mac が完了を反映した
  }
  pendAdd = pendAdd.filter(a => !texts.has(a.text) && Date.now() - a.at < day);                       // Mac が追加を反映した
  store.set("pendDone", pendDone); store.set("pendAdd", pendAdd);
}
let pendNote = store.get("pendNote", {});   // {社名: {prio, memo, at}}：Mac が反映するまで iPhone の値を見せる
const noteOf = c => {
  let p = pendNote[c.name];
  if (!p) for (const k of coKeys(c)) if (pendNote[k]) { p = pendNote[k]; break; }
  p = p || {};
  return {prio: p.prio ?? c.prio ?? 0, memo: p.memo ?? c.memo ?? ""};
};
function pruneNotes() {
  for (const k in pendNote) {
    const c = findCo(k), p = pendNote[k];
    if (!c) { delete pendNote[k]; continue; }
    if (c.name !== k && !pendNote[c.name]) { pendNote[c.name] = p; delete pendNote[k]; }
    else if (c.name !== k) { delete pendNote[k]; continue; }
    if (Date.now() - p.at > 864e5 * 3 || ((p.prio === undefined || (c.prio || 0) === p.prio) && (p.memo === undefined || (c.memo || "") === p.memo))) delete pendNote[c.name];
  }
  store.set("pendNote", pendNote);
}
const openTasks = () => D.tasks.filter(t => !pendDone[t.id]).length + pendAdd.length;

/* ⚡️11-11 入口から分けた2本：企業の関連メール（mails）と検索用の本文（search）。要る時だけ読む。
   入口に parts の印がある時だけ分かれている。古い入口は全部入りなので、その時は何も読まずに入口の値を使う。
   読めなくても画面はそのまま。次に要る時にもう一度だけ頼む。 */
const PART = {mails: {v: "", data: null, stamp: 0, busy: false, tried: 0, fail: false}, search: {v: "", data: null, stamp: 0, busy: false, tried: 0, fail: false}};
const partSplit = k => !!(D && D.parts && D.parts[k]);
const partPending = k => partSplit(k) && !PART[k].data && !PART[k].fail;
const mailsOf = c => (c && c.mails) || (c && PART.mails.data && (PART.mails.data[c.name] || coKeys(c).map(k => PART.mails.data[k]).find(Boolean))) || [];
const qOf = m => m.q != null ? m.q : (PART.search.data && PART.search.data[m.id]) || "";
function needPart(k) {
  const p = PART[k];
  if (!partSplit(k) || p.v === D.parts[k] || p.busy || Date.now() - p.tried < 15000) return;
  p.busy = true; p.tried = Date.now();
  api.part(k, p.stamp).then(r => {
    if (!r || !r.text) { if (!p.data) p.fail = true; return; }
    const j = JSON.parse(r.text); p.data = j.items || {}; p.v = j.v || ""; p.stamp = r.stamp || 0; p.fail = false;
  }).catch(() => { if (!p.data) p.fail = true; }).finally(() => { p.busy = false; try { partArrived(k); } catch (e) {} });
}
/* 届いたら、開いている所だけ差し替える（入力中の字・スクロールの位置は動かさない） */
function partArrived(k) {
  if (!D) return;
  if (k === "mails") {
    const slot = document.getElementById("mlslot");
    if (slot && view.v === "company") { const c = findCo(view.c); if (c) { slot.innerHTML = coMailsHTML(c); bindCoMails(); } }
    const ps = document.getElementById("pmslot");
    if (ps) { const c = findCo(ps.dataset.co); if (c) ps.innerHTML = evMailsHTML(c); }
  }
  const res = document.getElementById("sres");
  if (res && view.v === "search" && (view.q || "").trim()) { res.innerHTML = searchResults(view.q); bind(res); }
}
let lbTimer = 0;
function setLoadbar(on) {
  const el = document.getElementById("loadbar");
  if (!el) return;
  clearTimeout(lbTimer);
  if (on) { el.classList.add("on"); el.style.width = "64%"; }
  else { el.style.width = "100%"; lbTimer = setTimeout(() => { el.classList.remove("on"); el.style.width = "0"; }, 280); }
}
function dd2HTML(d, isDue) {
  const mo = d.getMonth() + 1, da = d.getDate(), w = WD[d.getDay()], we = [0, 6].includes(d.getDay());
  return `<span class="dd2${we ? " we" : ""}${isDue ? " due" : ""}"><span class="m">${mo}月</span><b>${da}</b><span class="w">${w}</span></span>`;
}
function cleanSnipJS(s) {
  let x = String(s || "").replace(/\s+/g, " ").trim();
  x = x.replace(/^(?:[^\s。！]{1,12}[ 　]*){1,3}(?:様|さま|さん)[ 　]*(?:こんにちは|いつもお世話になっております|お世話になっております|はじめまして|お疲れ様(?:です)?)?[。！!,、 　]*/, "");
  x = x.replace(/^(?:いつもお世話になっております|お世話になっております|こんにちは|はじめまして)[。！!,、 　]*/, "");
  x = x.replace(/^[^\s。！]{1,28}(?:新卒採用(?:グループ|事務局)?|採用担当|採用事務局|人事部)(?:です|でございます)[。！!,、 　]*/, "");
  return x || String(s || "").trim();
}
function unifiedCoMails(c) {
  const rawMails = mailsOf(c), notes = c.notes || [];
  const normK = s => String(s || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
  const byKey = new Map();
  for (const m of rawMails) {
    const k = normK(m.subject) + "|" + String(m.at || "").slice(0, 10);
    if (!byKey.has(k)) byKey.set(k, m);
  }
  const list = [];
  const used = new Set();
  for (const n of notes) {
    const k = normK(n.subject) + "|" + String(n.at || "").slice(0, 10);
    const gm = byKey.get(k);
    if (gm) used.add(gm);
    const rawSnip = gm ? gm.snippet : "";
    list.push({
      at: n.at, due: n.due || "", title: n.what || n.subject, rawWhat: n.what || "",
      subject: n.subject, from: gm ? gm.from : c.name, body: cleanSnipJS(rawSnip), rawBody: rawSnip,
      app: gm ? gm.app : "", url: gm ? gm.url : ""
    });
  }
  for (const m of rawMails) {
    if (used.has(m)) continue;
    list.push({
      at: m.at, due: "", title: cleanSubjectClient(m.subject), rawWhat: m.subject,
      subject: m.subject, from: m.from || c.name, body: cleanSnipJS(m.snippet), rawBody: m.snippet || "",
      app: m.app || "", url: m.url || ""
    });
  }
  return list.sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
}
function cleanSubjectClient(s) {
  return String(s || "").replace(/^[\s【\[「『]*(?:重要|※|リマインド|再送)?[\s】\]」』]*(?:【[^】]{1,28}】\s*)*/, "").trim() || String(s || "");
}
function openMailSheet(c, m) {
  const d = pd(m.at);
  const el = openPlain(`
    <div class="shd"><h3>メール本文</h3><button type="button" class="x" aria-label="閉じる">${ICN.close}</button></div>
    <div class="fld-grp">
      <div style="font-size:12px;color:var(--sub)">${esc(m.from || c.name)} ・ ${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）</div>
      <div style="font-size:15.5px;font-weight:700;margin-top:4px">${esc(m.subject || m.title)}</div>
      ${m.due ? `<div style="margin-top:6px"><span class="duec" style="margin-left:0">${esc(m.due)}</span></div>` : ""}
      <div style="font-size:14px;color:var(--ink);line-height:1.6;margin-top:10px;white-space:pre-wrap">${esc(m.body || m.rawBody || "本文の抜粋はありません")}</div>
    </div>
    ${m.app || m.url ? `<a class="save" style="display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none" ${mailHref(m)}>${ICN.mail}<span>Gmail で開く</span></a>` : ""}
    ${c.url ? `<a class="cancel" style="display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none" href="${esc(c.url)}" target="_blank" rel="noopener">${ICN.link}<span>マイページを開く</span></a>` : ""}`);
  el.querySelector(".x").onclick = () => closeSheet();
}
function evMailsHTML(co) {
  const mails = mailsOf(co).slice(0, 2);
  return mails.length ? `<div class="sec" style="margin-left:4px">メール</div><div class="grp">${mails.map(x => `<a class="mail" ${mailHref(x)}><div class="h"><span>${esc(x.from)}</span><span>${pd(x.at).getMonth()+1}/${pd(x.at).getDate()}</span></div><div class="sbj">${esc(x.subject)}</div></a>`).join("")}</div>` : "";
}
/* 企業のページの統一「メール」（整理／従来切替・タップで詳細シート） */
function coMailsHTML(c) {
  const items = unifiedCoMails(c), showAll = !!view.allMail, mm = store.get("mailMode", "after");
  const skelRows = c.lastMail && partSplit("mails") && !PART.mails.data && !PART.mails.fail
    ? [0, 1].map(() => `<div class="r"><div class="sk" style="width:36px;height:36px;border-radius:8px;flex:none"></div><div class="main"><div class="sk" style="height:14px;width:58%"></div><div class="sk" style="height:11px;width:82%;margin-top:6px"></div></div></div>`).join("")
    : "";
  if (!items.length && !skelRows) return "";
  const shown = items.slice(0, showAll ? 30 : 4);
  const more = !showAll && items.length > 4 ? `<button type="button" class="more" id="allm">すべて表示（${items.length}通）</button>` : "";
  const rowsHTML = shown.map((m, idx) => {
    const d = pd(m.at);
    return mm === "after"
      ? `<button type="button" class="r" data-um="${idx}">${dd2HTML(d, false)}<div class="main"><div class="t">${esc(m.title)}${m.due ? `<span class="duec">${esc(m.due)}</span>` : ""}</div><div class="s">${esc(m.body || m.subject)}</div></div><span class="chev" style="width:14px;height:14px;color:var(--faint);flex:none">${ICN.chevRight}</span></button>`
      : `<div class="r" style="align-items:flex-start">${dd2HTML(d, false)}<div class="main"><div class="t">${esc(m.rawWhat || m.title)}</div><div class="s" style="white-space:normal">${esc(m.subject)}</div>${m.rawBody ? `<div class="s" style="white-space:normal;margin-top:4px">${esc(m.rawBody)}</div>` : ""}${m.app || m.url ? `<div style="margin-top:4px"><a ${mailHref(m)} style="color:var(--lapis);font-size:12.5px">開く</a></div>` : ""}</div></div>`;
  }).join("");
  return `<div class="group">${rowsHTML || skelRows}${more}</div>`;
}
function bindCoMails(coOpt) {

function mdHTML(md) {
  const inl = t => {
    const links = [];
    const ph = String(t ?? "").replace(/\[([^\]]+)\]\((https?:\/{2}[^\s)]+)\)/g, (_, lbl, u) => {
      links.push(`<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--lapis)">${esc(lbl)}</a>`);
      return `\u0001L${links.length - 1}\u0002`;
    });
    return esc(ph).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/(完了|済み|済)(?=[\s）)】:：]|$)/g, '<span class="tag ok">$1</span>').replace(/(進行中|対応中)/g, '<span class="tag go">$1</span>').replace(/(保留|待ち)/g, '<span class="tag hold">$1</span>')
      .replace(/([0-9]{1,3}(?:,[0-9]{3})+円)/g, '<span class="yen">$1</span>')
      .replace(/https?:\/{2}[^\s<]+/g, raw => {
        let tail = "";
        const u = raw.replace(/(?:&quot;|&gt;|[).,;!?。、）」』】\]>])+$/, m => { tail = m; return ""; });
        return u ? `<a href="${u}" target="_blank" rel="noopener" style="color:var(--lapis)">${u.replace(/^https?:\/{2}/, "").slice(0, 36)}</a>${tail}` : raw;
      })
      .replace(/\u0001L(\d+)\u0002/g, (_, idx) => links[+idx]);
  };
  let out = "", inList = false, inTable = false;
  const close = () => { if (inList) { out += "</ul>"; inList = false; } if (inTable) { out += "</table>"; inTable = false; } };
  for (const raw of md.split(/\n/)) {
    const l = raw.trimEnd();
    if (!l.trim()) { close(); continue; }
    if (/^#\s/.test(l)) continue;                                   // 一番上の題は札の題に出す
    if (/^#{2}\s/.test(l)) { close(); out += `<h3>${inl(l.replace(/^#+\s*/, ""))}</h3>`; continue; }
    if (/^#{3,6}\s/.test(l)) { close(); out += `<h4>${inl(l.replace(/^#+\s*/, ""))}</h4>`; continue; }
    if (/^\s*\|/.test(l)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; if (!inTable) { close(); out += "<table>"; inTable = true; }
      out += "<tr>" + l.replace(/^\s*\||\|\s*$/g, "").split("|").map(c => `<td>${inl(c.trim())}</td>`).join("") + "</tr>"; continue; }
    const li = l.match(/^\s*(?:[-*・]|\d+[.)])\s+(\[( |x|X)\]\s*)?(.*)$/);
    if (li) { if (!inList) { if (inTable) { out += "</table>"; inTable = false; } out += "<ul>"; inList = true; }

    close(); out += `<p>${inl(l)}</p>`;
  }
  close(); return out;
}
