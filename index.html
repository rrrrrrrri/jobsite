        .replace(/\d{1,2}[:：]\d{2}(?:\s*[〜~\-–−]\s*\d{1,2}[:：]\d{2})?/g, " ")
        .replace(/先着予約受付中|予約受付開始|申し込み可能な日程なし|受付終了|現時点は募集前で予約不可|予約はマイページから[。]?|申込はマイページから[。]?|メンテ延長で|へ延長|の?(?:事前予約期限|受験期限|受検締切|応募締切|回答期限)[はの：:]?|〆|締切|締め切り/g, " ")
        .replace(/[：:]\s*(?=[・。\s,、]|$)/g, " ")
        .replace(/(?:^|[\s・])[〜~\-–−]+(?=$|[\s・])/g, " ")
        .replace(/(?:^|[・。\s])[はがをへ](?=[・。\s→⇒]|$)/g, " ")
        .replace(/[・／、。\s→⇒]{2,}/g, "・")
        .replace(/[（(][^）)]{0,18}$/, "")
        .replace(/^[\s・／、。〜~\-–()（）：:→⇒はがを]+|[\s・／、。〜~\-–()（）：:→⇒はがを]+$/g, "");
      if (rest.length >= 4 && !/^\d/.test(rest)) summary = rest.slice(0, 48).replace(/[（(][^）)]{0,18}$/, "");
    }
    const coreKey = normKey(title);
    const topicKey = /適性検査|能力検査/.test(title) ? "topic_test"
      : /本社見学会/.test(title) ? "topic_onsite_visit"
      : /11月WEB|WEBセミナー/.test(title) ? "topic_11web"
      : /社員座談会/.test(title) ? "topic_talk"
      : coreKey;
    rawCards.push({ id: "ev_" + coreKey.slice(0, 24) + "_" + ei, coreKey, topicKey, title, summary, booking, loc, status, slots });
  }

  // Deduplicate keeping newest section first
  const seenKeys = new Set(), events = [];
  for (const ev of rawCards) {
    if (seenKeys.has(ev.coreKey) || seenKeys.has(ev.topicKey)) continue;
    seenKeys.add(ev.coreKey);
    seenKeys.add(ev.topicKey);
    events.push({ id: ev.id, title: ev.title, summary: ev.summary, booking: ev.booking, loc: ev.loc, status: ev.status, slots: ev.slots });
  }
  return { updatedAt: `${latestSecD.getFullYear()}/${latestSecD.getMonth() + 1}/${latestSecD.getDate()}`, loginID, url, events };
}

function daySchedulesFor(dateStr) {
  if (!D || !dateStr) return [];
  const d0 = pd(dateStr + "T00:00"), d1 = new Date(d0); d1.setDate(d0.getDate() + 1);
  const out = [], seen = new Set();
  for (const e of (D.events || [])) {
    if (e.deleted || e.allDay) continue;
    const s = pd(e.start), en = pd(e.end);
    if (s.getFullYear() <= 1970 || en <= d0 || s >= d1) continue;
    const sm = s <= d0 ? 0 : s.getHours() * 60 + s.getMinutes();
    const em = en >= d1 ? 1440 : en.getHours() * 60 + en.getMinutes();
    const tent = !!(e.tent || /仮押さえ|仕分け箱|暫定/.test(e.cal || ""));
    const k = norm(e.title) + "|" + e.start.slice(0, 16);
    seen.add(k);
    out.push({ start: sm, end: em, title: e.title, cal: e.cal || "予定", color: tent ? "#ff7043" : (e.color || CAL_COLORS[e.cal] || "#70a3fa"), tentative: tent });
  }
  for (const x of inboxList()) {
    if (x.allDay) continue;
    const s = pd(x.ns), en = pd(x.ne);
    if (en <= d0 || s >= d1) continue;
    const k = norm(x.title) + "|" + String(x.ns || "").slice(0, 16);
    if (seen.has(k)) continue;
    const sm = s <= d0 ? 0 : s.getHours() * 60 + s.getMinutes();
    const em = en >= d1 ? 1440 : en.getHours() * 60 + en.getMinutes();
    out.push({ start: sm, end: em, title: x.title, cal: "仕分け箱", color: "#ff7043", tentative: true });
  }
  return out.sort((a, b) => a.start - b.start);
}

function evalSlotFeasibility(slot, coName) {
  if (slot.closed) return { tier: "closed", badge: "終了", cue: slot.cue || "空き枠なし・巡回で再確認可" };
  const busy = daySchedulesFor(slot.date);
  if (slot.start == null || slot.end == null) {
    if (!busy.length) return { tier: "ok", badge: "参加可", cue: slot.dueTime ? `${slot.dueTime}〆・終日空き` : "終日空き・余裕あり" };
    return { tier: "ok", badge: "調整可", cue: `${mToHM(busy[0].start)} ${shortTitle(busy[0].title, coName)}${busy.length > 1 ? ` ほか${busy.length - 1}件` : ""}` };
  }
  const ov = busy.find(x => Math.max(slot.start, x.start) < Math.min(slot.end, x.end) && !x.tentative)
    || busy.find(x => Math.max(slot.start, x.start) < Math.min(slot.end, x.end));
  if (ov) {
    if (ov.tentative) return { tier: "tight", badge: "注意", tentativeHit: true, cue: `${mToHM(ov.start)} ${shortTitle(ov.title, coName)}（仕分け箱・未確定）` };
    return { tier: "conflict", badge: "重複", cue: `${mToHM(ov.start)}–${mToHM(ov.end)} ${shortTitle(ov.title, coName)}と重複` };
  }
  const prev = busy.filter(x => x.end <= slot.start).at(-1), next = busy.find(x => x.start >= slot.end);
  const gP = prev ? slot.start - prev.end : 999, gN = next ? next.start - slot.end : 999;
  const near = gP <= gN ? (prev ? { e: prev, gap: gP } : null) : (next ? { e: next, gap: gN } : null);
  if (near && near.gap < 45) {
    return { tier: "tight", badge: "注意", tentativeHit: !!near.e.tentative, cue: `${mToHM(near.e.start)} ${shortTitle(near.e.title, coName)}・間隔${near.gap}分${near.e.tentative ? "（未確定）" : ""}` };
  }
  if (near) return { tier: "ok", badge: "参加可", cue: `${mToHM(near.e.start)} ${shortTitle(near.e.title, coName)}まで余裕あり` };
  return { tier: "ok", badge: "参加可", cue: "終日空き・余裕あり" };
}

function dayBarHTML(slot, evEval) {
  const MIN = 7 * 60, MAX = 23 * 60, SPAN = MAX - MIN;
  const pct = m => Math.max(0, Math.min(100, ((m - MIN) / SPAN) * 100)).toFixed(2);
  const wPct = (s, e) => { const lo = pct(s); return Math.max(4, Math.min(100 - lo, ((e - s) / SPAN) * 100)).toFixed(2); };
  const busy = daySchedulesFor(slot.date).filter(x => x.end > MIN && x.start < MAX);
  const cs = slot.start != null ? Math.max(MIN, slot.start) : null, ce = slot.end != null ? Math.min(MAX, slot.end) : null;
  return `<div class="daybar-scale"><span>07:00</span><span>12:00</span><span>17:00</span><span>23:00</span></div>
    <div class="daybar">${busy.map(b => {
      const col = b.color || CAL_COLORS[b.cal] || "#70a3fa";
      const bs = Math.max(MIN, b.start), be = Math.min(MAX, b.end);
      return `<div class="blk${b.tentative ? " tentative" : ""}" style="left:${pct(bs)}%;width:${wPct(bs, be)}%;background:${hexRGBA(col, b.tentative ? .18 : .28)};color:#f5f5f7;border:1px ${b.tentative ? "dashed" : "solid"} ${hexRGBA(col, .8)}">${esc(b.title.slice(0, 6))}</div>`;
    }).join("")}${cs != null && ce != null && ce > cs ? `<div class="blk cand cand-${evEval.tier}" style="left:${pct(cs)}%;width:${wPct(cs, ce)}%">候補</div>` : ""}</div>`;
}

/* ── 検索：企業・予定・タスク・会（議事録の要約）・メール・Muse を横断 ── */
function hit(text, terms) { const n = norm(text); return terms.every(t => n.includes(t)); }
function snip(text, terms, len = 60) {
  const raw = String(text ?? "").replace(/\s+/g, " "), n = norm(raw), i = Math.max(0, n.indexOf(terms[0] || "") - 18);
  const s = (i > 0 ? "…" : "") + raw.slice(i, i + len) + (raw.length > i + len ? "…" : "");
  const ts = [...new Set(terms.filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!ts.length) return esc(s);
  const rx = new RegExp(ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", last = 0, m;
  while ((m = rx.exec(s)) !== null) {
    out += esc(s.slice(last, m.index)) + `<mark>${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
function searchResults(q) {
  const terms = norm(q).split(/[\s　]+/).filter(Boolean); if (!terms.length) return "";
  const md = d => `${d.getMonth()+1}/${d.getDate()}`, sec = (title, rows) => rows.length ? `<div class="sec">${title}</div><div class="group shits">${rows.slice(0, 30).join("")}</div>` : "";
  const cos = D.companies.filter(c => hit([coSearchText(c), noteOf(c).memo, museOf(c), c.stageLabel].join(" "), terms))
    .map(c => `<button class="r" data-co="${esc(c.name)}"><span class="main"><div class="t">${snip(c.name, terms)}</div><div class="s">${esc(c.stageLabel || "")}${noteOf(c).memo && hit(noteOf(c).memo, terms) ? "・メモ：" + snip(noteOf(c).memo, terms) : ""}</div></span>${CH}</button>`);
  const evs = D.events.map((e, i) => ({e, i, s: pd(e.start)})).filter(x => !x.e.deleted && x.s.getFullYear() > 1970 && hit([x.e.title, x.e.loc, x.e.cal].join(" "), terms)).sort((a, b) => b.s - a.s)
    .map(x => `<button class="r" data-ev="${x.i}"><span class="main"><div class="t">${snip(x.e.title, terms)}</div><div class="s">${md(x.s)}（${WD[x.s.getDay()]}）${x.e.allDay ? "終日" : hm(x.s)}${x.e.loc ? "・" + esc(x.e.loc) : ""}</div></span></button>`);
  const tks = D.tasks.filter(t => !pendDone[t.id] && hit(t.t, terms)).map(t => `<div class="r"><span class="main"><div class="t">${snip(t.t, terms)}</div>${t.due ? `<div class="s">${md(pd(t.due))} まで</div>` : ""}</span></div>`);
  const mts = D.meets.filter(m => hit([m.company, m.kind, m.title, qOf(m)].join(" "), terms)).sort((a, b) => b.date.localeCompare(a.date))
    .map(m => `<button class="r" data-meet="${m.id}"><span class="main"><div class="t">${esc(m.company)} ${esc(m.kind)}<span style="color:var(--sub);font-weight:400;font-size:13px">　${md(pd(m.date))}</span></div><div class="s">${snip(hit(m.title, terms) ? m.title : qOf(m) || m.title, terms, 80)}</div></span>${CH}</button>`);
  const mails = []; for (const c of D.companies) for (const m of mailsOf(c)) if (hit([m.subject, m.snippet, m.from].join(" "), terms)) mails.push({c, m});
  mails.sort((a, b) => b.m.at.localeCompare(a.m.at));
  const mls = mails.map(({c, m}) => `<a class="r" ${mailHref(m)}><span class="main"><div class="t">${snip(m.subject, terms)}</div><div class="s">${esc(c.name)}・${md(pd(m.at))}　${snip(m.snippet, terms)}</div></span></a>`);
  const bd = BOARD.filter(b => hit(b.n + " " + b.text, terms)).map(b => `<a class="r" href="${esc(b.u)}" target="_blank" rel="noopener"><span class="main"><div class="t">${snip(b.n.replace(/^\d{4}-\d{2}-\d{2}_/, ""), terms)}</div><div class="s">${snip(b.text, terms)}</div></span>${CH}</a>`);
  const out = sec("企業", cos) + sec("会・議事録", mts) + sec("予定", evs) + sec("タスク", tks) + sec("メール", mls) + sec("Muse", bd);
  // 分けた2本がまだ届いていない間は「ありません」と言い切らない
  const wait = partPending("mails") || partPending("search")
    ? `<div class="group" style="margin-top:12px">${[0,1].map(() => `<div class="r"><div class="main"><div class="sk" style="height:15px;width:54%"></div><div class="sk" style="height:12px;width:76%;margin-top:6px"></div></div></div>`).join("")}</div>` : "";
  return out ? out + wait : wait || `<p class="empty">「${esc(q)}」に当たる物はありません</p>`;
}

function formatMinutesInline(raw) {
  const s = String(raw ?? "");
  if (!s) return "";
  const sp = [];
  const add = (start, end, prio, kind, payload = "") => {
    if (start < end) sp.push({start, end, prio, kind, payload});
  };
  const scan = (re, fn) => { re.lastIndex = 0; let m; while ((m = re.exec(s)) !== null) { if (m[0].length === 0) { re.lastIndex++; continue; } fn(m); } };
  // 1) URL は丸ごと保護（途中の数字・日付を壊さない）
  scan(/https?:[/][/][^\s「」『』（）()、。<>\x22]+/g, m => add(m.index, m.index + m[0].length, 110, "plain"));
  // 2) 〔画面 m:ss〕
  scan(/\s*〔画面\s*([\d:]+)〕\s*/g, m => add(m.index, m.index + m[0].length, 100, "scr", m[1]));
  // 3) 締切・パスワード・選考日程（ruby マーカー）
  scan(/（〆[^）]{1,30}）|〆[^\s、。）]{1,20}/g, m => add(m.index, m.index + m[0].length, 92, "due"));
  scan(/(?:パスワード|パスコード|チェックイン(?:用)?コード|応募者?ID)\s*[:：]\s*[A-Za-z0-9._-]{3,32}/g, m => add(m.index, m.index + m[0].length, 91, "due"));
  scan(/(?:本日|今日|明日|明後日|今週|来週|今月|来月)(?:\s*(?:中|末|\d{1,2}[:：]\d{2}|\d{1,2}時(?:\d{1,2}分)?))?(?:まで(?:に)?)?/g, m => {
    if (/(?:まで|\d|中|末)/.test(m[0])) add(m.index, m.index + m[0].length, 90, "due");
  });
  scan(/\d{1,2}[/]\d{1,2}（[日月火水木金土]）(?:\s*\d{1,2}:\d{2}(?:\s*[〜~\-–−]\s*\d{1,2}:\d{2})?)?/g, m => {
    if (m.index === 0 || !/\d/.test(s[m.index - 1])) add(m.index, m.index + m[0].length, 90, "due");
  });
  scan(/(?:(?:202[7-9]|203\d)年\d{1,2}月|2026年(?:11|12)月)(?:\d{1,2}日|[上下中]旬)?(?:\s*[〜~\-–−から]\s*(?:20\d{2}年)?\d{1,2}月(?:\d{1,2}日|[上下中]旬)?)?(?:まで(?:に)?)?/g, m => {
    if (m.index === 0 || !/\d/.test(s[m.index - 1])) add(m.index, m.index + m[0].length, 90, "due");
  });
  const dueCtxRe = /選考|応募|ES|面接|締切|期限|受付|提出|開催|予約|開始|予定|イベント|アンケート|テスト/;
  scan(/(?:2026年)?\d{1,2}月(?:\d{1,2}日|[上下中]旬)(?:[（(][日月火水木金土][）)])?(?:\s*[〜~\-–−から]\s*\d{1,2}月(?:\d{1,2}日|[上下中]旬)?)?(?:まで(?:に)?)?/g, m => {
    const start = m.index, end = start + m[0].length;
    if (start > 0 && /[\d年]/.test(s[start - 1])) return;
    const ctx = s.slice(Math.max(0, start - 28), Math.min(s.length, end + 28));
    if (/[上下中]旬|まで|〆/.test(m[0]) || dueCtxRe.test(ctx)) add(start, end, 89, "due");
    else add(start, end, 54, "num");
  });
  // 4) 話者・登壇者名（lapis 色＋話者ラベル控えめ）
  const badNameRe = /^(?:彼氏|両氏|諸氏|同氏|各氏|某氏|全氏|源氏|平氏|藤原氏|発表者|回答者|質問者|司会者|参加者|登壇者|主催者|担当者|学生|話者)氏?$/;
  scan(/(^|[^\u4E00-\u9FFF\u30A1-\u30FC]|的)([\u4E00-\u9FFF\u30A1-\u30FC]{1,6}氏?)(（話者[A-Z0-9]+）)/g, m => {
    const ns = m.index + m[1].length, ne = ns + m[2].length;
    if (!badNameRe.test(m[2])) {
      add(ns, ne, 80, "person");
      add(ne, ne + m[3].length, 79, "spk");
    }
    return ne;
  });
  scan(/(^|[^\u4E00-\u9FFF]|的)([\u4E00-\u9FFF]{1,5}氏)(?!名|族|神)/g, m => {
    const ns = m.index + m[1].length, ne = ns + m[2].length;
    if (!badNameRe.test(m[2])) add(ns, ne, 78, "person");
  });
  scan(/(^|[^\u4E00-\u9FFF])([\u4E00-\u9FFF]{2,4}さん)(?!業|組)/g, m => {
    const ns = m.index + m[1].length, ne = ns + m[2].length;
    if (!/^(?:皆さん|御社さん|奥さん|旦那さん|ご主人さん|赤ちゃんさん)$/.test(m[2])) add(ns, ne, 77, "person");
  });
  scan(/（話者[A-Z0-9]+）/g, m => add(m.index, m.index + m[0].length, 72, "spk"));
  // 5) 重要キーワードマーカー（topaz 蛍光マーカー。1段落あたり最大4件・重複抑止）
  scan(/「[^」]{2,20}」/g, m => add(m.index, m.index + m[0].length, 66, "key"));
  scan(/[一-龥ァ-ヶーA-Za-z0-9・]{2,18}（(?:[A-Z]{2,8}値?|DX|ERP|DCS|SCM|OJT|KPI|ROI|AI|IT[/]OT)[^）]{0,16}）/g, m => {
    if (m.index === 0 || !/[一-龥ァ-ヶーA-Za-z0-9]/.test(s[m.index - 1])) add(m.index, m.index + m[0].length, 67, "key");
  });
  scan(/(?:一次|二次|三次|最終)?応募(?:ES受付|面接)|エントリーシート(?:提出)?|書類審査をパス|書類選考|適性検査|Webテスト|事業所(?:・|および)職種別(?:採用)?|今後の選考|方針が確定|確定した|権限移譲|両立支援制度|育児時間制度|育児時短勤務|産休・育休|連続夏季休暇|独身寮|カフェテリアプラン|ワークライフバランス|プロセス制御|フィードバックループ|少数精鋭|海外売上比率|TOEIC(?:の必須点数)?/g, m => {
    add(m.index, m.index + m[0].length, 65, "key");
  });
  // 6) 文中の意味ある数値・期間・年次（#158 準拠: CO2/B2B/MP4 等は対象外）
  scan(/24時間365日|20\d{2}年(?:\d{1,2}月(?:\d{1,2}日)?)?|\d{1,2}時(?!間)(?:\d{1,2}分|半)?(?:\s*[〜~\-–−]\s*\d{1,2}時(?!間)(?:\d{1,2}分|半)?)?|(?:入社|第)?\d+(?:[.,]\d+)?(?:\s*[〜~\-–−]\s*\d+(?:[.,]\d+)?)?(?:年目|年間|年\d{1,2}[ヶか]月間?|ヶ月間?|か月間?|週間|日間|時間|分間|分|秒)|(?:約|最大|最低|平均|全社)?\d+(?:[.,]\d+)?(?:\s*[〜~\-–−]\s*\d+(?:[.,]\d+)?)?(?:%|％|割|倍|社|名|人|円|万円|億円|℃|度|点|歳|件|部門)|\d{1,2}:\d{2}(?:\s*[〜~\-–−]\s*\d{1,2}:\d{2})?/g, m => {
    const start = m.index, end = start + m[0].length;
    if ((start > 0 && /[A-Za-z0-9_]/.test(s[start - 1])) || (end < s.length && /[A-Za-z0-9_]/.test(s[end]))) return;
    add(start, end, 55, "num");
  });

  sp.sort((a, b) => b.prio - a.prio || a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const chosen = [], seenKey = new Set();
  let keyCnt = 0, numCnt = 0;
  for (const c of sp) {
    if (chosen.some(u => c.start < u.end && c.end > u.start)) continue;
    if (c.kind === "key") {
      const k = s.slice(c.start, c.end);
      if (keyCnt >= 4 || seenKey.has(k)) continue;
      seenKey.add(k); keyCnt++;
    } else if (c.kind === "num") {
      if (numCnt >= 8) continue;
      numCnt++;
    }
    chosen.push(c);
  }
  chosen.sort((a, b) => a.start - b.start);
  let out = "", pos = 0;
  for (const c of chosen) {
    if (c.start > pos) out += esc(s.slice(pos, c.start));
    const txt = s.slice(c.start, c.end);
    if (c.kind === "scr") out += `<span class="scr">画面 ${esc(c.payload)}</span>`;
    else if (c.kind === "due") out += `<mark class="mk-due">${esc(txt)}</mark>`;
    else if (c.kind === "key") out += `<mark class="mk-key">${esc(txt)}</mark>`;
    else if (c.kind === "person") out += `<span class="hl-person">${esc(txt)}</span>`;
    else if (c.kind === "spk") out += `<span class="hl-spk">${esc(txt)}</span>`;
    else if (c.kind === "num") out += `<span class="hl-num">${esc(txt)}</span>`;
    else out += esc(txt);
    pos = c.end;
  }
  if (pos < s.length) out += esc(s.slice(pos));
  return out;
}

function splitMinutesSentences(text) {
  const s = String(text ?? "").trim();
  if (!s) return [];
  const out = [];
  let start = 0, d = 0;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "「" || ch === "（" || ch === "(" || ch === "〔") d++;
    else if ((ch === "」" || ch === "）" || ch === ")" || ch === "〕") && d > 0) d--;
    else if (ch === "。" && d === 0) {
      let end = i + 1;
      const tail = /^(\s*〔画面\s*[\d:]+〕)/.exec(s.slice(end));
      if (tail) { end += tail[1].length; i = end - 1; }
      const seg = s.slice(start, end).trim();
      if (seg) out.push(seg);
      start = end;
    }
  }
  const rest = s.slice(start).trim();
  if (rest) out.push(rest);
  return out;
}

function classifyMinutesPara(p, idx = 0) {
  const s = String(p ?? "").trim();
  if (!s) return {kind: "plain", label: "", tone: "plain"};
  if (/^(本会議|本説明会|本イベント|本セッション)/.test(s)) return {kind: "overview", label: "全体概要", tone: "lapis"};
  const first = splitMinutesSentences(s)[0] || s;
  const head = first.slice(0, 160);
  if (!/^イベント冒頭/.test(head)) {
    const names = new Set();
    const exclude = /^(?:彼氏|両氏|諸氏|同氏|各氏|某氏|全氏|源氏|平氏|藤原氏|発表者|回答者|質問者|司会者|参加者|登壇者|主催者|担当者|学生|話者)氏?$/;
    const r1 = /(^|[^\u4E00-\u9FFF\u30A1-\u30FC]|的)([\u4E00-\u9FFF\u30A1-\u30FC]{1,6}氏?)(（話者[A-Z0-9]+）)/g;
    const r2 = /(^|[^\u4E00-\u9FFF]|的)([\u4E00-\u9FFF]{1,5}氏)(?!名|族|神)/g;
    let m;
    while ((m = r1.exec(head)) !== null) { if (!exclude.test(m[2])) names.add(m[2]); }
    while ((m = r2.exec(head)) !== null) { if (!exclude.test(m[2])) names.add(m[2]); }
    if (names.size === 1) return {kind: "person", label: [...names][0], tone: "lapis", icon: "person"};
  }
  if (/今後のアクション|今後の選考|参加学生は|締切|期限|までに|応募方法|選考スケジュール|エントリーシート/.test(head)) {
    return {kind: "action", label: "選考・アクション", tone: "ruby"};
  }
  if (/決定し|決まっ|確定した|合意し|承認し/.test(head)) return {kind: "decision", label: "決定", tone: "emerald"};
  if (/福利厚生|両立支援|育児|産休|社員寮|住宅補助|ワークライフバランス|休暇制度|働き方/.test(head)) {
    return {kind: "welfare", label: "働き方・制度", tone: "emerald"};
  }
  if (/ビジネス|事業領域|事業内容|プロセス制御|企業理念|社是|会社概要|社会的役割|システム刷新|仕組み/.test(head)) {
    return {kind: "business", label: "事業・仕組み", tone: "topaz"};
  }
  if (idx === 0) return {kind: "overview", label: "全体概要", tone: "lapis"};
  return {kind: "plain", label: "", tone: "plain"};
}

function renderMeetKey(m, markOn = true) {
  if (!m) return '<p class="empty">要点はまだありません</p>';
  const personSVG = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 8a3 3 0 100-6 3 3 0 000 6zm0 1.5c-2.67 0-5.5 1.34-5.5 3.5V14h11v-1c0-2.16-2.83-3.5-5.5-3.5z"/></svg>';
  const secHead = (title, tone) => `<h2 class="sec m-sec"><span class="m-sec-bar" style="background:var(--${tone})" aria-hidden="true"></span>${esc(title)}</h2>`;
  const sect = (label, color, arr) => arr && arr.length
    ? secHead(label, color) + `<div class="group">${arr.map(x => `<div class="li"><span class="dot" style="background:var(--${color})" aria-hidden="true"></span><span class="m-li-tx">${formatMinutesInline(x)}</span></div>`).join("")}</div>`
    : "";

  const decHTML = sect("決まったこと", "lapis", m.decisions || []);
  const todoHTML = sect("やること", "emerald", (m.todos || []).map(t => t.t + (t.due ? `（〆${t.due}）` : "")));

  let sumHTML = "";
  const sumParas = String(m.summary || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
  if (sumParas.length) {
    sumHTML = secHead("概要", "lapis") + `<div class="m-stack">${sumParas.map((p, idx) => {
      const cls = classifyMinutesPara(p, idx);
      const sents = splitMinutesSentences(p);
      let calloutIdx = -1;
      if (sents.length >= 2) {
        calloutIdx = sents.findIndex(st => /今後のアクション|今後の選考は|方針が確定|参加学生は.*(?:提出|応募|エントリー|備える)|（〆|パスワード\s*[:：]/.test(st));
      }
      const calloutSent = calloutIdx >= 0 ? sents[calloutIdx] : "";
      const bodySents = calloutIdx >= 0 ? sents.filter((_, j) => j !== calloutIdx) : sents;
      const beats = [];
      if (bodySents.length >= 4 && bodySents.join("").length > 140) {
        for (let i = 0; i < bodySents.length; i += 2) beats.push(bodySents.slice(i, i + 2).join(""));
      } else if (bodySents.length) {
        beats.push(bodySents.join(""));
      }
      const badge = cls.label ? `<div class="m-badge b-${cls.tone}">${cls.icon === "person" ? personSVG : ""}${esc(cls.label)}</div>` : "";
      const callIsDue = /明日|今日|本日|月|日|下旬|上旬|中旬|202\d年|〆|期限|締切|パスワード|ES|受付|面接/.test(calloutSent);
      const callLbl = /今後のアクション|提出|応募|エントリー|備える|〆|パスワード/.test(calloutSent) ? "次アクション" : "重要ポイント";
      const calloutHTML = calloutSent
        ? `<div class="m-callout${callIsDue ? " is-due" : ""}"><span class="m-callout-lbl">${callLbl}</span>${formatMinutesInline(calloutSent)}</div>`
        : "";
      return `<div class="mcard-p t-${cls.tone}">${badge}${beats.map(b => `<p>${formatMinutesInline(b)}</p>`).join("")}${calloutHTML}</div>`;
    }).join("")}</div>`;
  }

  const topics = (m.topics || []).filter(t => t && t.p && t.p.length && !/画面に映って/.test(t.t));
  const topicHTML = topics.map(t => {
    const parsed = t.p.map(rawItem => {
      let rest = String(rawItem ?? "").trim(), leadScr = "";
      const sm = /^〔画面\s*([\d:]+)〕\s*/.exec(rest);
      if (sm) { leadScr = sm[1]; rest = rest.slice(sm[0].length); }
      const pm = /^([^。：\n]{2,28})：([\s\S]+)$/.exec(rest);
      const prefix = pm && !/^https?$/i.test(pm[1].trim()) ? pm[1].trim() : "";
      const bodyTxt = prefix ? pm[2].trim() : rest;
      return {raw: rawItem, leadScr, prefix, bodyTxt};
    });
    const chunks = [];
    for (let i = 0; i < parsed.length; ) {
      const cur = parsed[i];
      if (cur.prefix) {
        let j = i + 1;
        while (j < parsed.length && parsed[j].prefix === cur.prefix) j++;
        if (j - i >= 2) {
          const items = parsed.slice(i, j);
          const firstScr = items[0].leadScr;
          chunks.push(`<h3 class="m-sub">${esc(cur.prefix)}${firstScr ? ` <span class="scr">画面 ${esc(firstScr)}</span>` : ""}</h3><ul class="m-sub-ul">${items.map(it => `<li>${formatMinutesInline(it.bodyTxt)}${it.leadScr && it.leadScr !== firstScr ? ` <span class="scr">画面 ${esc(it.leadScr)}</span>` : ""}</li>`).join("")}</ul>`);
          i = j; continue;
        }
      }
      const scrTag = cur.leadScr ? ` <span class="scr">画面 ${esc(cur.leadScr)}</span>` : "";
      chunks.push(cur.prefix
        ? `<div class="m-item"><span class="hl-lead">${esc(cur.prefix)}</span>：${formatMinutesInline(cur.bodyTxt)}${scrTag}</div>`
        : `<div class="m-item">${formatMinutesInline(cur.raw)}</div>`);
      i++;
    }
    return secHead(t.t, "topaz") + `<div class="m-topic">${chunks.join("")}</div>`;
  }).join("");

  const noteParas = String(m.notes || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
  const notesHTML = noteParas.length
    ? secHead("メモ", "emerald") + `<div class="mcard-p t-plain">${noteParas.map(p => `<p>${formatMinutesInline(p)}</p>`).join("")}</div>`
    : "";

  const content = decHTML + todoHTML + sumHTML + topicHTML + notesHTML;
  if (!content) return '<p class="empty">要点はまだありません</p>';

  const barHTML = `<div class="m-bar"><div class="m-legend"><span class="m-legend-it"><i class="m-sw key" aria-hidden="true"></i>重要</span><span class="m-legend-it"><i class="m-sw due" aria-hidden="true"></i>日時・締切</span><span class="m-legend-it"><i class="m-sw person" aria-hidden="true"></i>人物</span><span class="m-legend-it"><i class="m-sw num" aria-hidden="true"></i>数値</span></div><button type="button" class="m-tog" data-mk-toggle="1" aria-pressed="${Boolean(markOn)}">マーカー ${markOn ? "ON" : "OFF"}</button></div>`;
  return `<div class="m-wrap${markOn ? "" : " mk-off"}" id="meetKeyWrap">${barHTML}${content}</div>`;
}

    for (const [t, s] of m.segs) { while (i < fr.length && fr[i].t <= t) { out += fig(fr[i++]); open = false; } if (!open) { out += '<div class="para">'; open = true; } out += `<span class="st">${mmss(t)}</span>${esc(s)}`; }

  main.innerHTML = head + body;

// 写真を押すと全画面で見る（純正の写真：黒の上に拡大・下へはらうか押すと閉じる）
function viewPhoto(src) {
  const v = document.createElement("div"); v.className = "pv"; v.innerHTML = `<img alt="" src="${esc(src)}">`;
  document.body.append(v); void v.offsetWidth; v.classList.add("on");
  const close = () => { v.classList.remove("on"); setTimeout(() => v.remove(), 280); };
  v.onclick = close; let y0 = null;
  v.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, {passive: true});
  v.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) close(); y0 = null; });
}
