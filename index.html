<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活">
<link rel="apple-touch-icon" href="icon.png">
<title>就活</title>
<style>
/* 上に Aletheia の「直近N日」の時間割、右上にタスク、下に企業2列。押すと次の画面へ。色は宝石色を意味にだけ */
:root{
  --bg:#f2f2f7; --card:#ffffff; --label:#000; --sub:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3); --sep:rgba(60,60,67,.16);
  --ink:#1c1c1e; --fill:rgba(120,120,128,.12); --grid:rgba(60,60,67,.12);
  --lapis:#2159bd; --ruby:#cc1c42; --rubysoft:#c06a78; --topaz:#c79a45; --emerald:#3a9a7e; --now:#ff3b30;
  --bar:rgba(249,249,249,.92);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:light;
}
@media all{:root{
  --bg:#000; --card:#1c1c1e; --label:#fff; --sub:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --ink:#f2f2f7; --fill:rgba(118,118,128,.24); --grid:rgba(235,235,245,.08);
  --lapis:#70a3fa; --ruby:#f25770; --rubysoft:#d08592; --topaz:#d6ab5e; --emerald:#4fb894; --bar:rgba(22,22,24,.92); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin:-8px -12px 6px;padding:0 8px;border-bottom:.5px solid var(--sep)}
.nav .back{color:var(--lapis);display:flex;align-items:center;gap:2px;padding:8px 6px}
.nav .mid{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw;text-align:center}
.large{font-size:30px;font-weight:700;margin:6px 4px 8px;line-height:1.2}
.meta{font-size:15px;color:var(--sub);margin:-2px 4px 10px}
.sec{font-size:13px;color:var(--sub);margin:20px 16px 7px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 16px;position:relative;color:inherit;text-decoration:none}
.r + .r::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.r.ind + .r.ind::before{left:66px}
.r .main{flex:1;min-width:0}
.r .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:13px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:13px;color:var(--faint);flex:none}
.date{width:38px;flex:none;text-align:center;line-height:1.05}
.date b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.date span{font-size:11px;color:var(--sub)}
.date.we span{color:var(--rubysoft)}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:15px}
.err{background:var(--card);border-radius:12px;padding:16px;color:var(--ruby);font-size:15px;margin:8px 0}

/* カレンダー（アプリの直近N日と同じ作り） */
.cal{background:var(--card);border-radius:18px;padding:12px 8px 8px 0;position:relative}
.calbar{display:flex;align-items:center;gap:6px;padding:0 4px 6px 14px}
.calbar h1{font-size:22px;font-weight:700;margin:0;flex:1;white-space:nowrap}
.round{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--sub)}
.round svg{width:12px;height:12px}
.taskbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:44px;height:44px;border-radius:12px;background:var(--fill);color:var(--lapis);margin-left:4px}
.taskbtn svg{width:18px;height:18px}
.taskbtn b{font-size:12px;font-variant-numeric:tabular-nums;line-height:1}
.dayhead{display:grid;margin-left:44px}
.dayhead div{text-align:center;padding:2px 0 4px}
.dayhead .w{font-size:12px;color:var(--sub)}
.dayhead .n{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.dayhead .sun .w,.dayhead .sun .n{color:var(--rubysoft)}
.dayhead .today .n{background:var(--lapis);color:#fff}
.allday{display:grid;margin-left:44px;gap:2px 0;padding-bottom:4px}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px}
.grid{position:relative;margin-left:44px;border-top:.5px solid var(--grid)}
.hour{position:absolute;left:-44px;width:40px;text-align:right;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;transform:translateY(-7px)}
.hline{position:absolute;left:0;right:0;height:.5px;background:var(--grid)}
.ev{position:absolute;border-radius:8px;padding:3px 5px 3px 12px;overflow:hidden;font-size:12px;line-height:1.25;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.ev.short{flex-direction:row;gap:4px;align-items:center;padding-top:0;padding-bottom:0;white-space:nowrap}
.ev.short::before{display:none}.ev.short::after{top:50%;transform:translateY(-50%)}
.ev.short .ti{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.ev::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:currentColor;opacity:.8}
.ev::after{content:"";position:absolute;left:3.5px;top:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.ev .tm{font-weight:600;font-variant-numeric:tabular-nums}
.ev .ti{font-weight:700;font-size:13px;word-break:break-all}
.ev .en{position:absolute;bottom:3px;left:12px;font-weight:600;font-variant-numeric:tabular-nums}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3}
.nowpill{position:absolute;left:-44px;width:42px;text-align:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--now);border-radius:9px;transform:translateY(-8px);z-index:4;font-variant-numeric:tabular-nums}

/* 企業2列 */
.cos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.co{background:var(--card);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-height:64px}
.co b{font-size:15px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.co .foot{display:flex;align-items:center;gap:6px;min-height:8px}
.co .dl{font-size:12px;color:var(--ruby);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .spark{width:13px;height:13px;color:#8e6bd8;margin-left:auto;flex:none}
.steps{display:flex;gap:3px;flex:none}
.steps i{width:6px;height:6px;border-radius:50%;background:var(--fill)}
.steps i.on{background:var(--ink)}
.steps.end i.on{background:var(--rubysoft)}

/* 会のページ */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:6px 0 12px}
.seg button{text-align:center;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;position:relative}
.li + .li::before{content:"";position:absolute;top:0;left:34px;right:0;height:.5px;background:var(--sep)}
.li .dot{margin-top:7px}
.para{background:var(--card);border-radius:12px;padding:12px 16px;line-height:1.65}
.para p{margin:0 0 10px}.para p:last-child{margin:0}
.st{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;display:block;margin-top:12px}
.st:first-child{margin-top:0}
figure{margin:12px -12px}
figure .ph{width:100%;aspect-ratio:16/9;background:var(--fill);display:block}
figure img{width:100%;max-width:100%;display:block}
figcaption{font-size:12px;color:var(--sub);padding:5px 16px 0}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -12px}
.photos .ph,.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--fill)}
.muse{background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.6}
.muse h4{margin:10px 0 2px;font-size:14px}.muse h4:first-child{margin-top:0}
.muse p{margin:0 0 4px}
/* タスク（アプリと同じ丸） */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;position:relative}
.task + .task::before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--sep)}
.ring{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:1px}
.task .s{font-size:13px;color:var(--sub);margin-top:2px}
.due{color:var(--ruby)}
.upd{font-size:11px;color:var(--faint);text-align:center;margin-top:16px}
@media (min-width:640px){.cos{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 質感：押した時は少し沈む・画面は横から入る・吹き出しはばねで開く（動きは transform だけ） */
:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.3,1.12,.5,1)}
button,a.r{transition:transform .18s var(--ease),background-color .2s,opacity .2s}
button:active,a.r:active{transform:scale(.97)}
.r:active,.task:active{transform:none;background:var(--fill)}
.ev:active,.chip:active{transform:scale(.95)}
.co:active{transform:scale(.96)}
.in-push{animation:pushIn .38s var(--ease) both}
.in-pop{animation:popIn .32s var(--ease) both}
.in-next{animation:pageNext .34s var(--ease) both}
.in-prev{animation:pagePrev .34s var(--ease) both}
.in-flip{animation:flipIn .36s var(--ease) both}
@keyframes pushIn{from{transform:translateX(36%)}to{transform:none}}
@keyframes popIn{from{transform:translateX(-24%)}to{transform:none}}
@keyframes pageNext{from{transform:translateX(18%)}to{transform:none}}
@keyframes pagePrev{from{transform:translateX(-18%)}to{transform:none}}
@keyframes flipIn{from{transform:scale(.94)}to{transform:none}}
.calbody{overflow:hidden}
.seg{position:relative}
.seg .pill{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .32s var(--ease)}
.seg button{position:relative;z-index:1}
.seg button[aria-selected="true"]{background:none;box-shadow:none}

/* 表示の切り替え（日／月） */
.flip{height:30px;border-radius:15px;background:var(--fill);display:flex;align-items:center;padding:2px;gap:0;position:relative}
.flip span{position:relative;z-index:1;font-size:13px;font-weight:600;width:34px;text-align:center;color:var(--sub);transition:color .25s}
.flip span.on{color:var(--label)}
.flip i{position:absolute;top:2px;bottom:2px;left:2px;width:34px;border-radius:13px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .32s var(--ease)}
.flip.m i{transform:translateX(34px)}

/* 月 */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:0 6px 0 8px}
.month .wk{font-size:11px;color:var(--sub);text-align:center;padding:2px 0 6px}
.month .wk.sun{color:var(--rubysoft)}
.mday{min-height:64px;border-top:.5px solid var(--grid);padding:3px 1px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;border-radius:0}
.mday .n{align-self:center;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.mday.out{opacity:.35}
.mday.sun .n{color:var(--rubysoft)}
.mday.today .n{background:var(--lapis);color:#fff}
.mday .bar{font-size:9.5px;line-height:1.35;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:600}
.mday .more{font-size:9.5px;color:var(--sub);text-align:center}

/* 吹き出し（アプリの予定の吹き出しと同じ作り） */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0);transition:background .25s}
.scrim.on{background:rgba(0,0,0,.18)}
.pop{position:fixed;z-index:21;width:min(300px,calc(100vw - 24px));background:var(--card);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.22),0 0 0 .5px var(--sep);padding:14px 16px 12px;transform-origin:var(--ox,50%) var(--oy,0);
  animation:popOpen .42s var(--spring) both}
.pop.out{animation:popClose .18s var(--ease) both}
@keyframes popOpen{from{transform:scale(.6)}to{transform:none}}
@keyframes popClose{to{transform:scale(.85);opacity:0}}
.pop .arrow{position:absolute;width:14px;height:14px;background:var(--card);transform:rotate(45deg);left:var(--ax,50%);margin-left:-7px}
.pop .arrow.up{top:-6px;box-shadow:-.5px -.5px 0 var(--sep)}
.pop .arrow.dn{bottom:-6px;box-shadow:.5px .5px 0 var(--sep)}
.pop h3{margin:0 0 2px;font-size:17px;font-weight:700;line-height:1.3;display:flex;gap:8px;align-items:flex-start}
.pop h3 .dot{margin-top:7px}
.pop .when{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.pop .row{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:8px;color:var(--label)}
.pop .row svg{width:15px;height:15px;color:var(--sub);flex:none;margin-top:2px}
.pop .act{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;height:38px;border-radius:10px;background:var(--fill);color:var(--lapis);font-size:15px;font-weight:600;width:100%;text-align:center}

/* タスク：押すと丸が埋まり、少しして行が畳まれる */
.task{transition:background-color .2s}
.task .ring{display:grid;place-items:center;transition:background-color .2s,border-color .2s,transform .25s var(--spring)}
.task .ring svg{width:12px;height:12px;color:#fff;transform:scale(0);transition:transform .3s var(--spring)}
.task.done .ring{background:var(--lapis);border-color:var(--lapis)!important;transform:scale(1.08)}
.task.done .ring svg{transform:none}
.task.done .tx{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--faint)}
.task .tx{transition:color .25s}
.task.gone{animation:collapse .32s var(--ease) forwards}
@keyframes collapse{to{transform:translateX(-12px);opacity:0;min-height:0;height:0;padding-top:0;padding-bottom:0}}
.task.wait .s .q{color:var(--sub)}
.addrow{display:flex;gap:12px;align-items:center;padding:8px 16px}
.addrow .plus{width:22px;height:22px;border-radius:50%;background:var(--lapis);color:#fff;display:grid;place-items:center;flex:none}
.addrow .plus svg{width:12px;height:12px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:17px;border:0;background:none;color:var(--label);padding:6px 0;outline:none}
.addrow input::placeholder{color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,0);background:rgba(30,30,32,.94);color:#fff;
  border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25);
  animation:toastIn .4s var(--spring) both;white-space:nowrap}
.toast button{color:#7fb2ff;font-weight:600;padding:4px 6px}
.toast.out{animation:toastOut .22s var(--ease) both}
@keyframes toastIn{from{transform:translate(-50%,140%)}to{transform:translate(-50%,0)}}
@keyframes toastOut{to{transform:translate(-50%,140%)}}
.note{font-size:12px;color:var(--sub);margin:8px 16px 0}
/* 企業のページ */
.prio{display:grid;grid-template-columns:auto repeat(5,1fr);align-items:center;gap:0;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 6px;position:relative}
.prio .lb{font-size:13px;color:var(--sub);padding:0 10px 0 8px}
.prio button{text-align:center;font-size:13px;font-weight:600;padding:6px 0;border-radius:7px;color:var(--sub);position:relative;z-index:1;transition:color .25s}
.prio button.on{color:var(--label);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{font-size:11px;font-weight:700;color:var(--lapis);background:color-mix(in srgb,var(--lapis) 14%,transparent);border-radius:5px;padding:1px 5px;white-space:nowrap;flex:none}
.prog{background:var(--card);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.prog .top{display:flex;align-items:center;gap:10px}
.prog .stg{font-size:17px;font-weight:700}
.prog .when{font-size:13px;color:var(--sub);margin-left:auto}
.prog .nx{font-size:15px;color:var(--ruby);font-weight:600}
.prog .pt{font-size:13px;color:var(--sub)}
.tl{position:relative}
.tl .li{padding:10px 16px 10px 16px}
.tl .d{font-size:12px;color:var(--sub);width:40px;flex:none;font-variant-numeric:tabular-nums;padding-top:2px}
.tl .w{font-size:15px}
.tl .sj{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.duec{display:inline-block;font-size:11px;font-weight:700;color:#8a6a00;background:rgba(255,204,0,.22);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
@media all{.duec{color:#ffd60a;background:rgba(255,214,10,.16)}}
.mail{display:block;padding:10px 16px;position:relative;color:inherit;text-decoration:none}
.mail + .mail::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.mail .h{display:flex;gap:8px;font-size:13px;color:var(--sub)}.mail .h span:last-child{margin-left:auto;flex:none}
.mail .sbj{font-size:15px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .sn{font-size:13px;color:var(--sub);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{display:block;width:100%;text-align:center;color:var(--lapis);font-size:15px;padding:11px 0;border-top:.5px solid var(--sep)}
.memo{background:var(--card);border-radius:12px;padding:4px 16px 8px}
.memo textarea{width:100%;min-height:96px;border:0;background:none;color:var(--label);font:inherit;font-size:16px;line-height:1.5;resize:none;outline:none;padding:8px 0}
.memo textarea::placeholder{color:var(--faint)}
.memo .st2{font-size:12px;color:var(--sub);text-align:right;min-height:16px;transition:opacity .3s}
.files .r .t{font-size:15px}
/* 自動で取り込んだ締切（黄色い枠のボタン） */
.dls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -12px 6px;padding-left:12px;padding-right:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dls::-webkit-scrollbar{display:none}
.dlb{flex:none;display:flex;flex-direction:column;gap:1px;min-width:132px;max-width:200px;padding:8px 11px;border-radius:12px;border:1.5px solid #f5c400;background:rgba(255,204,0,.10)}
.dlb .dd{font-size:12px;font-weight:700;color:#a07800;font-variant-numeric:tabular-nums}
@media all{.dlb .dd{color:#ffd60a}}
.dlb .dc{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlb .dw{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlb .au{font-size:10px;color:var(--sub)}

<script>
/* 11-08 どこかで落ちたら「読み込み中」のまま黙らせない＝理由を画面に出す */
window.onerror = (msg, src, line, col) => { const m = document.getElementById("main"); if (m && /読み込み中/.test(m.textContent)) m.innerHTML = `<div class="err">画面の読み込みで止まりました：${String(msg).replace(/[<>&]/g, "")}（${line}:${col}）</div>`; };

  return c; })();

  index: st => GAS ? call("getIndex", st) : API ? remote({fn: "index", st: st || 0}) : fetch("data/index.json", {cache: "no-store"}).then(r => r.text()).then(t => ({stamp: t.length, text: t})),

/* iPhone で押した頼み（Mac が反映するまでの間もそう見せる）。端末に覚えるので閉じても消えない */
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

const ORDER = ["entry","document","test","interview1","interview2","finalInterview","offer"];

/* ── 予定の吹き出し（押した予定の上か下に、矢印付きで開く） ── */
const IC = {
  clock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5" stroke-linecap="round"/></svg>',

function coOfEvent(i) { return D.companies.find(c => (c.evs || []).includes(i)); }

const MEET_RE = /https:\/{2}[^\s<>"]*(zoom\.us|zoom\.com|teams\.microsoft\.com|teams\.live\.com|teams\.cloud\.microsoft|meet\.google\.com|webex\.com)[^\s<>"]*/i;

const svcName = u => /zoom/i.test(u) ? "Zoom" : /teams/i.test(u) ? "Teams" : /meet\.google/i.test(u) ? "Meet" : /webex/i.test(u) ? "Webex" : "会議";
function relDay(s) { const t0 = new Date(); t0.setHours(0,0,0,0); const d0 = new Date(s); d0.setHours(0,0,0,0); const n = Math.round((d0 - t0) / 864e5);

    const a = new Date(s); a.setMinutes(0); a.setHours(a.getHours() - 1); const b = new Date(a); b.setHours(a.getHours() + 4);
    const PX = 30, near = D.events.map((x, k) => ({...x, k, s: pd(x.start), e: pd(x.end)})).filter(x => !x.allDay && x.e > a && x.s < b).sort((p, q) => p.s - q.s);

  const pane = pg.querySelector(".pane"); let x0 = null, y0 = 0, dx = 0, lock = null;
  pg.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = null; pane.style.transition = "none"; }, {passive: true});
  pg.addEventListener("touchmove", e => { if (x0 === null) return; const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) * 1.2 ? "x" : "y";
    if (lock === "x") { dx = mx; pane.style.transform = `translateX(${dx}px)`; } }, {passive: true});
  pg.addEventListener("touchend", () => { if (x0 === null) return; x0 = null;
    if (lock === "x" && Math.abs(dx) > 60) { const dir = dx < 0 ? 1 : -1; pane.style.transition = "transform .22s var(--ease)"; pane.style.transform = `translateX(${dx < 0 ? -40 : 40}%)`; setTimeout(() => stepBy(dir), 120); }
    else { pane.style.transition = "transform .35s var(--spring)"; pane.style.transform = ""; } });
}
// 上の日付の列もはらえる（純正：週ごとに送る・指に付いて動く）
function dragWeek(wk) {
  let x0 = null, y0 = 0, dx = 0, lock = null, moved = false;
  wk.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = null; moved = false; wk.style.transition = "none"; }, {passive: true});
  wk.addEventListener("touchmove", e => { if (x0 === null) return; const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? "x" : "y";
    if (lock === "x") { dx = mx; moved = true; wk.style.transform = `translateX(${dx}px)`; } }, {passive: true});
  wk.addEventListener("touchend", () => { if (x0 === null) return; x0 = null;
    if (lock === "x" && Math.abs(dx) > 50) { const dir = dx < 0 ? 1 : -1; wk.style.transition = "transform .2s var(--ease)"; wk.style.transform = `translateX(${dx < 0 ? -60 : 60}%)`;
      setTimeout(() => { offset += dir * 7; slide(dir); const n = $(".wk7"); if (n) { n.classList.remove("in-next", "in-prev"); void n.offsetWidth; n.classList.add(dir > 0 ? "in-next" : "in-prev"); } }, 140); }
    else { wk.style.transition = "transform .35s var(--spring)"; wk.style.transform = ""; } });
  // はらった時は日付を押したことにしない

}
function weekStrip(st) {

  let h = [..."日月火水木金土"].map(w => `<div class="l">${w}</div>`).join("");
  for (let k = 0; k < 7; k++) { const d = new Date(ws); d.setDate(ws.getDate() + k); const kk = keyOf(d), on = sel.has(kk);
    const prev = new Date(d); prev.setDate(d.getDate() - 1); const next = new Date(d); next.setDate(d.getDate() + 1);
    const cls = [kk === today ? "t" : "", kk === keyOf(st) ? "sel" : "", on && N > 1 ? "rng" : "", on && (!sel.has(keyOf(prev)) || k === 0) ? "rs" : "", on && (!sel.has(keyOf(next)) || k === 6) ? "re" : ""].join(" ");

function daysView(evAll) {

  const now = new Date(), inRange = now >= start && now < end, today = keyOf(now);

    //   純正と同じく段違いに重ねる＝後ろの予定ほど右へ 14px ずつずらし、幅は残りいっぱい・色は不透明で上に重ねる。

    items.forEach(e => { if (!cur || e.s >= cur.end) { cur = {list: [], end: e.e}; clusters.push(cur); } cur.list.push(e); if (e.e > cur.end) cur.end = e.e; });

    clusters.forEach(cl => {
      const lanes = []; cl.list.forEach(e => { let k = lanes.findIndex(l => l <= e.s); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = e.e; e.lane = k; });

        if (top > H - 20) top = H - 20;
        const col = e.color || "#2159bd", w = 100 / N, lw = w / L, sh = hgt < 34, ind = Math.min(e.lane * 14, colPx * .45);
        const pos = cascade ? `left:calc(${c*w}% + ${1 + ind}px);width:calc(${w}% - ${2 + ind}px);z-index:${1 + e.lane};background:color-mix(in srgb,${col} 34%,#121214)`
                            : `left:calc(${c*w + e.lane*lw}% + 1px);width:calc(${lw}% - 2px);background:${tint(col, dark() ? .3 : .16)}`;
        g += `<button class="nev${sh ? " sh" : ""}${cascade ? " cas" : ""}" data-ev="${e.i}" style="--c:${col};--lines:${Math.max(1, Math.floor((hgt - 18) / 15))};top:${top}px;height:${hgt}px;${pos}"><span class="ti">${esc(e.title)}</span><span class="tm">${CLK}${hm(e.s)}${sh ? "" : "–" + hm(e.e)}</span></button>`;

    g += `<div class="nnow" style="top:${y(now)}px;left:${c*100/N}%;width:${100/N}%"></div><div class="npill" style="top:${y(now)}px">${hm(now)}</div>`; }

const failMsg = e => /authori[sz]|permission|権限|許可/i.test(String(e && e.message || e)) ? "書き込みの許可が要ります。ページを開き直して許可してください" : "送れませんでした。電波を確かめてください";
/* ── Muse の掲示板 ── */
function mdHTML(md) {
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(完了|済み|済)(?=[\s）)】:：]|$)/g, '<span class="tag ok">$1</span>').replace(/(進行中|対応中)/g, '<span class="tag go">$1</span>').replace(/(保留|待ち)/g, '<span class="tag hold">$1</span>')
    .replace(/([0-9]{1,3}(?:,[0-9]{3})+円)/g, '<span class="yen">$1</span>')
    .replace(/https?:\/{2}[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener" style="color:var(--lapis)">${u.replace(/^https?:\/{2}/, "").slice(0, 36)}</a>`);
  let out = "", inList = false, inTable = false;
  const close = () => { if (inList) { out += "</ul>"; inList = false; } if (inTable) { out += "</table>"; inTable = false; } };
  for (const raw of md.split(/\n/)) {
    const l = raw.trimEnd();
    if (!l.trim()) { close(); continue; }
    if (/^#\s/.test(l)) continue;                                   // 一番上の題は札の題に出す
    if (/^#{2}\s/.test(l)) { close(); out += `<h3>${inl(l.replace(/^#+\s*/, ""))}</h3>`; continue; }
    if (/^#{3,6}\s/.test(l)) { close(); out += `<h4>${inl(l.replace(/^#+\s*/, ""))}</h4>`; continue; }
    if (/^\s*\|/.test(l)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; if (!inTable) { close(); out += "<table>"; inTable = true; }
      out += "<tr>" + l.replace(/^\s*\||\|\s*$/g, "").split("|").map(c => `<td>${inl(c.trim())}</td>`).join("") + "</tr>"; continue; }
    const li = l.match(/^\s*(?:[-*・]|\d+[.)])\s+(\[( |x|X)\]\s*)?(.*)$/);
    if (li) { if (!inList) { if (inTable) { out += "</table>"; inTable = false; } out += "<ul>"; inList = true; }
      const done = li[2] && li[2].toLowerCase() === "x"; out += `<li class="${done ? "done" : ""}">${done ? '<span class="tag ok">完了</span>' : ""}${inl(li[3])}</li>`; continue; }
    close(); out += `<p>${inl(l)}</p>`;
  }
  close(); return out;
}
function boardHTML() {
  const md = d => `${d.getMonth()+1}/${d.getDate()} ${hm(d)}`;
  const st = BOARD.find(b => b.status), rest = BOARD.filter(b => b !== st);
  const cos = Object.entries(MUSEMT).filter(([, t]) => Date.now() - t < 864e5 * 7).sort((a, b) => b[1] - a[1]);

    try { await api.op({op: "prio", co: c.name, n: k}); if (other) await api.op({op: "prio", co: other.name, n: 0}); toast(k ? `第${k}志望にしました` : "志望の順を外しました"); }
    catch (e) { toast(failMsg(e)); }
  });
  const ta = $("#memo"); let tm = 0, last = n.memo;
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(96, ta.scrollHeight) + "px"; }; fit();
  const save = async () => { clearTimeout(tm); const v = ta.value; if (v === last) return; last = v; setNote("memo", v); $("#memost").textContent = "送っています…";
    try { await api.op({op: "memo", co: c.name, text: v}); if ($("#memost")) $("#memost").textContent = "送りました・Mac に届くと反映"; } catch (e) { if ($("#memost")) $("#memost").textContent = "送れませんでした"; last = null; } };
  ta.oninput = () => { fit(); clearTimeout(tm); tm = setTimeout(save, 1500); };
  ta.onblur = save;
  if ($("#allm")) $("#allm").onclick = () => { view = {...view, allMail: true}; render(); };
  bind(main);
}

/* ── 検索：企業・予定・タスク・会（議事録の要約）・メール・Muse を横断 ── */
const norm = t => String(t ?? "").normalize("NFKC").toLowerCase();
function hit(text, terms) { const n = norm(text); return terms.every(t => n.includes(t)); }
function snip(text, terms, len = 60) {
  const raw = String(text ?? "").replace(/\s+/g, " "), n = norm(raw), i = Math.max(0, n.indexOf(terms[0] || "") - 18);
  let out = esc((i > 0 ? "…" : "") + raw.slice(i, i + len) + (raw.length > i + len ? "…" : ""));
  for (const t of terms) if (t) out = out.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
  return out;
}
function searchResults(q) {
  const terms = norm(q).split(/[\s　]+/).filter(Boolean); if (!terms.length) return "";
  const md = d => `${d.getMonth()+1}/${d.getDate()}`, sec = (title, rows) => rows.length ? `<div class="sec">${title}</div><div class="group shits">${rows.slice(0, 30).join("")}</div>` : "";
  const cos = D.companies.filter(c => hit([c.name, noteOf(c).memo, MUSE[c.name] || c.muse || "", c.stageLabel].join(" "), terms))
    .map(c => `<button class="r" data-co="${esc(c.name)}"><span class="main"><div class="t">${snip(c.name, terms)}</div><div class="s">${esc(c.stageLabel || "")}${noteOf(c).memo && hit(noteOf(c).memo, terms) ? "・メモ：" + snip(noteOf(c).memo, terms) : ""}</div></span>${CH}</button>`);
  const evs = D.events.map((e, i) => ({e, i, s: pd(e.start)})).filter(x => hit([x.e.title, x.e.loc, x.e.cal].join(" "), terms)).sort((a, b) => b.s - a.s)
    .map(x => `<button class="r" data-ev="${x.i}"><span class="main"><div class="t">${snip(x.e.title, terms)}</div><div class="s">${md(x.s)}（${WD[x.s.getDay()]}）${x.e.allDay ? "終日" : hm(x.s)}${x.e.loc ? "・" + esc(x.e.loc) : ""}</div></span></button>`);
  const tks = D.tasks.filter(t => hit(t.t, terms)).map(t => `<div class="r"><span class="main"><div class="t">${snip(t.t, terms)}</div>${t.due ? `<div class="s">${md(pd(t.due))} まで</div>` : ""}</span></div>`);
  const mts = D.meets.filter(m => hit([m.company, m.kind, m.title, m.q].join(" "), terms)).sort((a, b) => b.date.localeCompare(a.date))
    .map(m => `<button class="r" data-meet="${m.id}"><span class="main"><div class="t">${esc(m.company)} ${esc(m.kind)}<span style="color:var(--sub);font-weight:400;font-size:13px">　${md(pd(m.date))}</span></div><div class="s">${snip(hit(m.title, terms) ? m.title : m.q || m.title, terms, 80)}</div></span>${CH}</button>`);
  const mails = []; for (const c of D.companies) for (const m of c.mails || []) if (hit([m.subject, m.snippet, m.from].join(" "), terms)) mails.push({c, m});
  mails.sort((a, b) => b.m.at.localeCompare(a.m.at));
  const mls = mails.map(({c, m}) => `<a class="r" ${mailHref(m)}><span class="main"><div class="t">${snip(m.subject, terms)}</div><div class="s">${esc(c.name)}・${md(pd(m.at))}　${snip(m.snippet, terms)}</div></span></a>`);
  const bd = BOARD.filter(b => hit(b.n + " " + b.text, terms)).map(b => `<a class="r" href="${esc(b.u)}" target="_blank" rel="noopener"><span class="main"><div class="t">${snip(b.n.replace(/^\d{4}-\d{2}-\d{2}_/, ""), terms)}</div><div class="s">${snip(b.text, terms)}</div></span>${CH}</a>`);
  const out = sec("企業", cos) + sec("会・議事録", mts) + sec("予定", evs) + sec("タスク", tks) + sec("メール", mls) + sec("Muse", bd);
  return out || `<p class="empty">「${esc(q)}」に当たる物はありません</p>`;
}
function search(main) {
  bar("検索", backName());
  const recent = store.get("recentQ", []);
  main.innerHTML = `<h1 class="large">検索</h1>
    <label class="sfield">${ICN.search}<input id="sq" type="search" enterkeyhint="search" placeholder="企業・予定・議事録・メール" value="${esc(view.q || "")}" autocomplete="off"><button class="clr" id="sqc" ${view.q ? "" : "hidden"} aria-label="消す">✕</button></label>
    <div id="sres">${view.q ? searchResults(view.q) : recent.length ? `<div class="sec">最近の検索</div><div class="ssug">${recent.map(r => `<button data-q="${esc(r)}">${esc(r)}</button>`).join("")}</div>` : ""}</div>`;
  const inp = $("#sq"), res = $("#sres"); let tm = 0;
  const run = () => { view = {...view, q: inp.value}; $("#sqc").hidden = !inp.value; res.innerHTML = inp.value.trim() ? searchResults(inp.value) : ""; bind(res); };
  // 日本語の変換中（「む」「むら」）では探さない＝確定した字で探す
  let composing = false;
  inp.addEventListener("compositionstart", () => { composing = true; });
  inp.addEventListener("compositionend", () => { composing = false; clearTimeout(tm); tm = setTimeout(run, 60); });
  inp.oninput = () => { if (composing) return; clearTimeout(tm); tm = setTimeout(run, 120); };
  inp.onkeydown = e => { if (e.key === "Enter") { inp.blur(); const v = inp.value.trim(); if (v) store.set("recentQ", [v, ...recent.filter(r => r !== v)].slice(0, 8)); } };
  $("#sqc").onclick = e => { e.preventDefault(); inp.value = ""; run(); inp.focus(); };
  main.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { inp.value = b.dataset.q; run(); });
  if (!view.q) setTimeout(() => inp.focus(), 350);
  bind(main);
}

/* ── 予定（会に結ばれていない物） ── */
function event(main) {
  const e = D.events[view.i]; bar(e.title, backName());
  const s = pd(e.start), en = pd(e.end);
  main.innerHTML = `<h1 class="large">${esc(e.title)}</h1><div class="group">
    <div class="r"><span class="main"><div class="t">${s.getMonth()+1}月${s.getDate()}日（${WD[s.getDay()]}）</div><div class="s">${e.allDay ? "終日" : `${hm(s)}〜${hm(en)}`}</div></span></div>
    ${e.loc ? `<div class="r"><span class="main"><div class="t" style="white-space:normal">${esc(e.loc)}</div></span></div>` : ""}
    <div class="r"><span class="dot" style="background:${esc(e.color)}"></span><span class="main"><div class="t">${esc(e.cal)}</div></span></div></div>`;
}

/* ── 会 ── */
async function meet(main) {
  const sum = D.meets.find(m => m.id === view.id); bar(sum ? sum.company : "", backName());
  main.innerHTML = '<p class="empty">読み込み中</p>';
  let m = meetCache[view.id];
  if (!m) { try { const t = await api.meet(view.id); m = t && JSON.parse(t); if (m) meetCache[view.id] = m; } catch (e) {} }
  if (!m) { main.innerHTML = '<div class="err">この会はまだドライブに上がっていません。少し待って開き直してください。</div>'; return; }
  if (view.v !== "meet" || view.id !== m.id) return;
  const tab = view.tab || "key", d = pd(m.date);
  const head = `<h1 class="large">${esc(m.kind)}</h1><div class="meta">${esc(m.company || "")}　${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）${hm(d)}・${dur(m.dur)}</div>
    <div class="seg" role="tablist"><span class="pill" style="width:calc((100% - 4px)/3);transform:translateX(${({key: 0, text: 100, photo: 200})[view.prevTab || tab]}%)"></span>${[["key","要点"],["text","本文"],["photo","写真"]].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (tab === "key") {
    // 〔画面 0:16〕は根拠の印＝本文からは外し、小さな時刻の札にする
    const cite = t => esc(String(t).replace(/\s*〔画面\s*([\d:]+)〕\s*/g, "\u0001$1\u0002").trim()).replace(/\u0001([\d:]+)\u0002/g, '<span class="scr">画面 $1</span>');
    const sect = (label, color, arr) => arr.length ? `<div class="sec">${label}</div><div class="group">${arr.map(x => `<div class="li"><span class="dot" style="background:var(--${color})"></span><span>${cite(x)}</span></div>`).join("")}</div>` : "";
    body = sect("決まったこと", "lapis", m.decisions) + sect("やること", "emerald", m.todos.map(t => t.t + (t.due ? `（〆${t.due}）` : ""))) + sect("数字", "topaz", m.numbers.slice(0, 10))
      + (m.summary ? `<div class="sec">概要</div><div class="para">${m.summary.split(/\n+/).map(p => `<p>${cite(p)}</p>`).join("")}</div>` : "")
      + m.topics.filter(t => t.p.length && !/画面に映って/.test(t.t)).map(t => `<div class="sec">${esc(t.t)}</div><div class="para">${t.p.map(p => `<p>${cite(p)}</p>`).join("")}</div>`).join("")
      + (m.notes ? `<div class="sec">メモ</div><div class="para">${m.notes.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join("")}</div>` : "");
    if (!body) body = '<p class="empty">要点はまだありません</p>';
  }
  if (tab === "text") {
    const fr = m.frames; let i = 0, out = "", open = false;
    const fig = f => `${open ? "</div>" : ""}<figure><span class="ph" data-img="${esc(f.img)}"></span><figcaption>${mmss(f.t)}${f.cap ? "　" + esc(f.cap) : ""}</figcaption></figure>`;
    for (const [t, s] of m.segs) { while (i < fr.length && fr[i].t <= t) { out += fig(fr[i++]); open = false; } if (!open) { out += '<div class="para">'; open = true; } out += `<span class="st">${mmss(t)}</span>${esc(s)}`; }
    if (open) out += "</div>";
    while (i < fr.length) out += fig(fr[i++]);
    body = out || '<p class="empty">本文はありません</p>';
  }
  if (tab === "photo") body = m.frames.length ? `<div class="photos">${m.frames.map(f => `<span class="ph" data-img="${esc(f.img)}"></span>`).join("")}</div>` : '<p class="empty">写真はありません</p>';
  main.innerHTML = head + body;
  const pill = main.querySelector(".seg .pill"); requestAnimationFrame(() => { pill.style.transform = `translateX(${({key: 0, text: 100, photo: 200})[tab]}%)`; });
  main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (b.dataset.tab === tab) return; view = {...view, prevTab: tab, tab: b.dataset.tab}; render(); });
  lazyImgs(main);
  requestAnimationFrame(navTitle);   // 中身は後から入る＝入った後に題の出し入れを決め直す
}
// 写真を押すと全画面で見る（純正の写真：黒の上に拡大・下へはらうか押すと閉じる）
function viewPhoto(src) {
  const v = document.createElement("div"); v.className = "pv"; v.innerHTML = `<img alt="" src="${src}">`;
  document.body.append(v); void v.offsetWidth; v.classList.add("on");
  const close = () => { v.classList.remove("on"); setTimeout(() => v.remove(), 280); };
  v.onclick = close; let y0 = null;
  v.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, {passive: true});
  v.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) close(); y0 = null; });
}
document.addEventListener("click", e => { const im = e.target.closest(".photos img, figure img"); if (im) viewPhoto(im.src); });
function lazyImgs(root) {
  const io = new IntersectionObserver(es => es.forEach(async e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    const n = e.target.dataset.img; let src = imgCache[n];
    if (!src) { try { src = await api.img(n); } catch (x) {} if (src) imgCache[n] = src; }
    if (src && e.target.isConnected) { const im = new Image(); im.alt = ""; im.src = src; im.className = e.target.className.replace("ph", ""); e.target.replaceWith(im); }
  }), {rootMargin: "600px 0px"});
  root.querySelectorAll("[data-img]").forEach(el => io.observe(el));
}

/* ── 読み込みと即時反映（開いている間は20秒ごと・戻ってきた時にも確かめる） ── */
// 予定・タスク・企業（Mac が書く index.json）を先に出し、Muse の物（各社の欄・資料・掲示板）は後から足す＝開いてすぐ見える。
const canRender = () => !drwEl && !palEl && !sheetEl && (view.v === "home" || (view.v === "search" && document.activeElement?.id !== "sq") || ((view.v === "company" || view.v === "tasks") && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)));
async function refresh(first) {
  const m = api.muse(museStamp).then(r => {
    if (!r || r.museStamp === museStamp) return;
    MUSE = r.muse || {}; FILES = r.files || {}; BOARD = r.board || []; MUSEMT = r.museMt || {}; museStamp = r.museStamp;
    if (D && canRender()) render();
  }).catch(() => {});
  try {
    const r = await api.index(stamp);
    if (r.text) { D = JSON.parse(r.text); stamp = r.stamp; prunePending(); pruneNotes(); applyPendEv(); if (first || canRender()) render(); }
    else if (first) $("#main").innerHTML = '<div class="err">まだ中身がありません。Mac の Aletheia が書くと出ます。</div>';
  } catch (e) {
    if (first || !D) $("#main").innerHTML = `<div class="err">読み込めませんでした：${esc(e && e.message || e)}</div>`;
  }
  return m;
}
refresh(true);
setTimeout(() => { if (!D && /読み込み中/.test($("#main").textContent)) $("#main").innerHTML = '<div class="err">読み込みに時間がかかっています。開き直してください（Mac の Google ドライブが止まっていないかも確かめます）</div>'; }, 30000);
setInterval(() => { if (!document.hidden) refresh(false); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
addEventListener("resize", () => { if (D && view.v === "home") { closePop(true); render(); } });
addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closePop(); } });
</script>
